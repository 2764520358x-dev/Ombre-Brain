<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>阴影</title>
<meta name="theme-color" content="#F7F7F7">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ombre">
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }

body {
  font-family: 'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background: #EDEDED;
  color: #181818;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  padding: calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;
  background: #F7F7F7;
  border-bottom: 1px solid #D0D0D0;
  flex-shrink: 0;
  gap: 4px;
  min-height: 56px;
}
.hdr-btn {
  width: 40px; height: 40px;
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #181818;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.15s;
}
.hdr-btn:active { background: rgba(0,0,0,0.08); }
.hdr-center {
  flex: 1;
  text-align: center;
  display: flex; flex-direction: column; gap: 2px;
}
.contact-name { font-size: 17px; font-weight: 600; }
.contact-status { font-size: 12px; color: #9B9B9B; }
#status-dot { display: none; }

/* ── MESSAGES ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: #EDEDED;
  overscroll-behavior: contain;
}
#messages::-webkit-scrollbar { width: 0; }

.time-sep {
  align-self: center;
  font-size: 11px;
  color: #9B9B9B;
  background: rgba(0,0,0,0.07);
  padding: 2px 8px;
  border-radius: 3px;
  margin: 6px 0;
}

.msg {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  padding: 4px 12px;
  gap: 8px;
  max-width: 100%;
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

.msg.user { flex-direction: row-reverse; }

/* Avatar */
.ai-avatar {
  width: 40px; height: 40px;
  border-radius: 6px;
  background: #1A1A1A;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  font-weight: 600;
  flex-shrink: 0;
  align-self: flex-start;
  user-select: none;
  letter-spacing: -1px;
}

/* Content column */
.msg-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: calc(100% - 56px);
}
.msg.user .msg-content { align-items: flex-end; }

/* Bubble */
.bubble {
  position: relative;
  padding: 10px 14px;
  line-height: 1.55;
  font-size: 16px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* AI bubble — white, top-left tail */
.msg.ai .bubble {
  background: #FFF;
  color: #181818;
  border-radius: 0 8px 8px 8px;
}
.msg.ai .bubble::before {
  content: '';
  position: absolute;
  left: -8px; top: 0;
  border-right: 8px solid #FFF;
  border-bottom: 8px solid transparent;
}

/* User bubble — WeChat green, top-right tail */
.msg.user .bubble {
  background: #95EC69;
  color: #181818;
  border-radius: 8px 0 8px 8px;
}
.msg.user .bubble::after {
  content: '';
  position: absolute;
  right: -8px; top: 0;
  border-left: 8px solid #95EC69;
  border-bottom: 8px solid transparent;
}

/* Streaming cursor */
.bubble.streaming::after {
  content: '|';
  animation: blink 0.7s step-end infinite;
  color: rgba(0,0,0,0.35);
  font-weight: 300;
}
/* Override user bubble ::after when streaming */
.msg.user .bubble.streaming::after {
  right: auto; top: auto;
  position: static;
  border: none;
  font-size: 16px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Thinking block */
.thinking-wrap {
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 8px;
  overflow: hidden;
  font-size: 13px;
  max-width: 100%;
}
.thinking-hdr {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px;
  cursor: pointer;
  color: #9B9B9B;
  font-size: 12px;
  user-select: none;
}
.thinking-hdr .arr { transition: transform 0.2s; font-size: 10px; }
.thinking-wrap.open .arr { transform: rotate(90deg); }
.thinking-body {
  display: none;
  padding: 8px 10px;
  color: #555;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
  border-top: 1px solid rgba(0,0,0,0.08);
}
.thinking-wrap.open .thinking-body { display: block; }

/* Time + retry */
.msg-time { font-size: 11px; color: #9B9B9B; padding: 0 2px; }
.msg.user .msg-time { text-align: right; }
.retry-notice {
  align-self: center;
  font-size: 12px; color: #9B9B9B;
  background: rgba(0,0,0,0.06);
  border-radius: 4px;
  padding: 3px 10px; margin: 4px 0;
}

/* ── INPUT BAR ── */
footer {
  background: #F7F7F7;
  border-top: 1px solid #D0D0D0;
  padding: 8px 12px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.input-row { display: flex; align-items: flex-end; gap: 8px; }
#input {
  flex: 1;
  background: #FFF;
  border: 1px solid #D0D0D0;
  border-radius: 20px;
  padding: 9px 16px;
  font-family: inherit;
  font-size: 16px;
  color: #181818;
  resize: none;
  max-height: 120px;
  min-height: 38px;
  line-height: 1.4;
  field-sizing: content;
  outline: none;
}
#input::placeholder { color: #BBBBB5; }
#send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: #07C160;
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
#send-btn:disabled { background: #C8C8C8; cursor: default; }
#send-btn:not(:disabled):active { transform: scale(0.88); }

/* ── AUTH SCREEN ── */
#auth-screen {
  position: fixed; inset: 0;
  background: #EDEDED;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 32px; z-index: 100;
}
#auth-screen.hidden { display: none; }
.auth-logo {
  width: 80px; height: 80px;
  border-radius: 20px;
  background: linear-gradient(135deg,#6B3FA0,#4B6CB7);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; color: #fff; font-weight: 600;
}
.auth-title { font-size: 20px; font-weight: 600; }
.auth-input {
  width: 100%; max-width: 300px;
  padding: 12px 16px;
  border: 1px solid #D0D0D0;
  border-radius: 8px;
  background: #FFF;
  font-family: inherit; font-size: 16px;
  color: #181818; outline: none;
}
.auth-btn {
  width: 100%; max-width: 300px;
  padding: 13px;
  background: #07C160;
  color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 16px;
  cursor: pointer; font-weight: 500;
}
.auth-hint { font-size: 12px; color: #9B9B9B; text-align: center; }

/* ── SETTINGS PANEL ── */
#settings {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: flex-end;
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
#settings.open { opacity:1; pointer-events:auto; }
.settings-sheet {
  width: 100%; max-width: 640px; margin: 0 auto;
  background: #F7F7F7;
  border-radius: 16px 16px 0 0;
  padding: 20px 20px max(20px,env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.25s ease;
  display: flex; flex-direction: column; gap: 12px;
}
#settings.open .settings-sheet { transform: none; }
.settings-title {
  font-size: 16px; font-weight: 600;
  text-align: center; padding-bottom: 4px;
}
.settings-divider { height: 1px; background: #D0D0D0; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px;
}
.settings-row input[type=text] {
  background: #FFF;
  border: 1px solid #D0D0D0;
  border-radius: 8px;
  padding: 6px 10px;
  font-family: inherit; font-size: 14px;
  color: #181818; outline: none;
}
.danger-btn {
  width: 100%; padding: 13px;
  background: #FA5151; color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 15px;
  cursor: pointer; font-weight: 500;
}
.settings-cancel {
  width: 100%; padding: 13px;
  background: #FFF; color: #181818;
  border: 1px solid #D0D0D0; border-radius: 8px;
  font-family: inherit; font-size: 15px; cursor: pointer;
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-logo">阴</div>
  <div class="auth-title">Ombre · 阴影</div>
  <input class="auth-input" id="auth-input" type="password" placeholder="访问密钥" autocomplete="current-password">
  <button class="auth-btn" id="auth-btn">进入</button>
  <div class="auth-hint">在服务器 CHAT_SECRET 环境变量中设置密钥<br>留空则不需要密钥</div>
</div>

<!-- HEADER -->
<header>
  <button class="hdr-btn" id="settings-btn" title="设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="hdr-center">
    <div class="contact-name">阴影</div>
    <div class="contact-status" id="status-label">待机</div>
  </div>
  <div style="width:40px"></div>
  <div id="status-dot"></div>
</header>

<!-- MESSAGES -->
<div id="messages"></div>

<!-- INPUT -->
<footer>
  <div class="input-row">
    <textarea id="input" placeholder="发消息…" rows="1"></textarea>
    <button id="send-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</footer>

<!-- SETTINGS PANEL -->
<div id="settings">
  <div class="settings-sheet">
    <div class="settings-title">设置</div>
    <div class="settings-divider"></div>
    <div class="settings-row">
      <span>服务地址</span>
      <input type="text" id="cfg-host" placeholder="https://your-server.com" style="width:180px">
    </div>
    <div class="settings-row">
      <span>访问密钥</span>
      <input type="text" id="cfg-secret" placeholder="留空则无需密钥" style="width:180px">
    </div>
    <div class="settings-divider"></div>
    <button class="auth-btn" id="cfg-save">保存</button>
    <button class="danger-btn" id="new-session-btn">🔄 新会话（清除上下文）</button>
    <button class="danger-btn" id="clear-history-btn" style="background:#9B9B9B">🗑 清除本地聊天记录</button>
    <button class="settings-cancel" id="settings-close">取消</button>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const cfg = {
  host:   localStorage.getItem('ombre_host')   || location.origin,
  secret: localStorage.getItem('ombre_secret') || '',
};
let chatId = localStorage.getItem('ombre_chatid') || uuid();
localStorage.setItem('ombre_chatid', chatId);

// ── AUTH ──────────────────────────────────────────────────────────────────────
const authScreen = document.getElementById('auth-screen');
if (cfg.secret) authScreen.classList.add('hidden');
document.getElementById('auth-btn').onclick = () => {
  cfg.secret = document.getElementById('auth-input').value.trim();
  localStorage.setItem('ombre_secret', cfg.secret);
  authScreen.classList.add('hidden');
};
document.getElementById('auth-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

// ── STATE ─────────────────────────────────────────────────────────────────────
let isGenerating = false;
let history = JSON.parse(localStorage.getItem(`ombre_hist_${chatId}`) || '[]');

// ── SETTINGS PANEL ────────────────────────────────────────────────────────────
const settingsEl = document.getElementById('settings');
document.getElementById('settings-btn').onclick = () => {
  document.getElementById('cfg-host').value   = cfg.host;
  document.getElementById('cfg-secret').value = cfg.secret;
  settingsEl.classList.add('open');
};
const closeSettings = () => settingsEl.classList.remove('open');
settingsEl.addEventListener('click', e => { if (e.target === settingsEl) closeSettings(); });
document.getElementById('settings-close').onclick = closeSettings;
document.getElementById('cfg-save').onclick = () => {
  cfg.host   = document.getElementById('cfg-host').value.trim()   || location.origin;
  cfg.secret = document.getElementById('cfg-secret').value.trim();
  localStorage.setItem('ombre_host',   cfg.host);
  localStorage.setItem('ombre_secret', cfg.secret);
  closeSettings();
};
document.getElementById('new-session-btn').onclick = () => {
  if (!confirm('开始新会话，Claude 将失去本次对话记忆（Ombre Brain 长期记忆保留）')) return;
  fetch(`${cfg.host}/api/session/${chatId}`, {
    method: 'DELETE',
    headers: cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {},
  }).catch(() => {});
  chatId = uuid();
  localStorage.setItem('ombre_chatid', chatId);
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  closeSettings();
  setStatus('idle');
};
document.getElementById('clear-history-btn').onclick = () => {
  if (!confirm('清除本地聊天记录显示？（不影响 Claude 进程内记忆）')) return;
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  closeSettings();
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function saveHistory() {
  localStorage.setItem(`ombre_hist_${chatId}`, JSON.stringify(history.slice(-200)));
}
function setStatus(s) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  dot.className = 'status-dot ' + (s === 'idle' ? '' : s);
  label.textContent = { idle:'待机', active:'连接中…', thinking:'思考中…', error:'出错了' }[s] || s;
}
function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── CREATE MESSAGE ROW ────────────────────────────────────────────────────────
function createMsgRow(role) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

  let contentEl = wrap;

  if (role !== 'user') {
    const avatar = document.createElement('div');
    avatar.className = 'ai-avatar';
    avatar.textContent = '阴';
    wrap.appendChild(avatar);

    const content = document.createElement('div');
    content.className = 'msg-content';
    wrap.appendChild(content);
    contentEl = content;
  } else {
    const content = document.createElement('div');
    content.className = 'msg-content';
    wrap.appendChild(content);
    contentEl = content;
  }

  msgs.appendChild(wrap);
  return { wrap, contentEl };
}

function appendMsg(role, text, thinking, time) {
  const msgs = document.getElementById('messages');
  const { wrap, contentEl } = createMsgRow(role);

  if (thinking) {
    const tw = document.createElement('div');
    tw.className = 'thinking-wrap';
    tw.innerHTML = `<div class="thinking-hdr"><span class="arr">▶</span> 思考过程</div>
      <div class="thinking-body">${escHtml(thinking)}</div>`;
    tw.querySelector('.thinking-hdr').onclick = () => tw.classList.toggle('open');
    contentEl.appendChild(tw);
  }

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  contentEl.appendChild(bub);

  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = time || now();
  contentEl.appendChild(t);

  msgs.scrollTop = msgs.scrollHeight;
  return bub;
}

// ── RENDER HISTORY ────────────────────────────────────────────────────────────
history.forEach(m => appendMsg(m.role, m.text, m.thinking, m.time));

// ── SEND ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || isGenerating) return;

  input.value = '';
  input.style.height = '';
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  const userTime = now();
  appendMsg('user', text, null, userTime);
  history.push({ role:'user', text, time: userTime });
  saveHistory();
  setStatus('active');

  // Create streaming AI row
  const msgs = document.getElementById('messages');
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg ai';

  const aiAvatar = document.createElement('div');
  aiAvatar.className = 'ai-avatar';
  aiAvatar.textContent = '阴';
  aiWrap.appendChild(aiAvatar);

  const aiContent = document.createElement('div');
  aiContent.className = 'msg-content';
  aiWrap.appendChild(aiContent);

  const aiBub = document.createElement('div');
  aiBub.className = 'bubble streaming';
  aiContent.appendChild(aiBub);
  msgs.appendChild(aiWrap);
  msgs.scrollTop = msgs.scrollHeight;

  let fullText    = '';
  let thinkingTxt = '';
  let thinkingWrap = null;
  let thinkingBody = null;

  try {
    const res = await fetch(`${cfg.host}/api/chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body: JSON.stringify({ chatId, text }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf      = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        handleEvent(ev);
      }
    }
  } catch (err) {
    aiBub.textContent = `⚠ 连接失败：${err.message}`;
    aiBub.classList.remove('streaming');
    setStatus('error');
    isGenerating = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  function handleEvent(ev) {
    if (ev.type === 'stream_event') {
      const delta = ev.event?.delta;
      if (!delta) return;

      if (delta.type === 'thinking_delta' && delta.thinking) {
        setStatus('thinking');
        thinkingTxt += delta.thinking;
        if (!thinkingWrap) {
          thinkingWrap = document.createElement('div');
          thinkingWrap.className = 'thinking-wrap open';
          thinkingBody = document.createElement('div');
          thinkingBody.className = 'thinking-body';
          const hdr = document.createElement('div');
          hdr.className = 'thinking-hdr';
          hdr.innerHTML = '<span class="arr">▶</span> 思考中…';
          hdr.onclick = () => thinkingWrap.classList.toggle('open');
          thinkingWrap.appendChild(hdr);
          thinkingWrap.appendChild(thinkingBody);
          aiContent.insertBefore(thinkingWrap, aiBub);
        }
        thinkingBody.textContent = thinkingTxt;
        msgs.scrollTop = msgs.scrollHeight;
      }

      if (delta.type === 'text_delta' && delta.text) {
        setStatus('active');
        fullText += delta.text;
        aiBub.textContent = fullText;
        msgs.scrollTop = msgs.scrollHeight;
      }
    }

    if (ev.type === 'system/api_retry') {
      const notice = document.createElement('div');
      notice.className = 'retry-notice';
      notice.textContent = `⏳ 限流中，${(ev.retry_delay_ms/1000).toFixed(0)}s 后重试…`;
      msgs.insertBefore(notice, aiWrap);
      setTimeout(() => notice.remove(), (ev.retry_delay_ms || 5000) + 500);
    }

    if (ev.type === 'result') {
      aiBub.classList.remove('streaming');
      const aiTime = now();
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = aiTime;
      aiContent.appendChild(timeEl);

      history.push({ role:'ai', text: fullText, thinking: thinkingTxt || null, time: aiTime });
      saveHistory();
      setStatus('idle');
      isGenerating = false;
      document.getElementById('send-btn').disabled = false;
    }
  }
}

// ── INPUT EVENTS ──────────────────────────────────────────────────────────────
document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
