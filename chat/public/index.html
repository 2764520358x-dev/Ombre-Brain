<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ombre</title>
<meta name="theme-color" content="#B85C3C">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ombre">
<style>
:root {
  --bg:           #E7E2D8;
  --surface:      #F4F0E8;
  --surface2:     #EDE8DE;
  --border:       #DCD6CA;
  --border-s:     #C7C0B2;
  --text:         #2C2A26;
  --text-dim:     #6E695E;
  --text-light:   #9E988C;
  --accent:       #B85C3C;
  --accent-gold:  #C2982F;
  --accent-light: #D7B14A;
  --positive:     #87A987;
  --sh-light:     rgba(255,253,247,0.9);
  --sh-dark:      rgba(150,138,116,0.40);
  --sh-subtle:    rgba(150,138,116,0.22);
  --lcd:          #C7C9BC;
  --lcd-text:     #25271E;
  --lcd-dim:      #5B5D4F;
  --r:            18px;
  --r-sm:         12px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  font-family: 'Share Tech Mono', 'Noto Sans SC', monospace, system-ui;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px env(safe-area-inset-top, 12px);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px var(--sh-subtle);
  flex-shrink: 0;
  gap: 10px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.logo svg { width:28px; height:28px; }
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-light);
  transition: background 0.4s;
  flex-shrink: 0;
}
.status-dot.active  { background: var(--positive); box-shadow: 0 0 6px var(--positive); }
.status-dot.thinking { background: var(--accent-gold); box-shadow: 0 0 6px var(--accent-gold); animation: pulse 1s infinite; }
.status-dot.error   { background: #BE5A41; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.header-actions { display:flex; gap:8px; }
.icon-btn {
  width:34px; height:34px;
  border:1px solid var(--border-s);
  border-radius: var(--r-sm);
  background: var(--surface2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  color: var(--text-dim);
  box-shadow: inset 1px 1px 2px var(--sh-light), inset -1px -1px 2px var(--sh-dark);
  transition: all 0.15s;
  font-size: 16px;
}
.icon-btn:active { box-shadow: inset 2px 2px 4px var(--sh-dark), inset -1px -1px 2px var(--sh-light); }

/* ── MESSAGES ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overscroll-behavior: contain;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border-s); border-radius:2px; }

.msg {
  max-width: 86%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  animation: fadeUp 0.2s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

.msg.user  { align-self: flex-end; }
.msg.ai    { align-self: flex-start; }

.bubble {
  padding: 10px 14px;
  border-radius: var(--r);
  line-height: 1.55;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent);
  color: #FAF8F3;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(184,92,60,0.3);
}
.msg.ai .bubble {
  background: var(--surface);
  color: var(--text);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
  box-shadow: 2px 2px 6px var(--sh-subtle);
}
.bubble.streaming::after {
  content: '▋';
  color: var(--accent-gold);
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* thinking block */
.thinking-wrap {
  background: var(--lcd);
  border: 1px solid var(--border-s);
  border-radius: var(--r-sm);
  overflow: hidden;
  font-size: 13px;
}
.thinking-hdr {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  cursor: pointer;
  color: var(--lcd-dim);
  font-size: 12px;
  user-select: none;
}
.thinking-hdr .arr { transition: transform 0.2s; }
.thinking-wrap.open .arr { transform: rotate(90deg); }
.thinking-body {
  display: none;
  padding: 8px 10px;
  color: var(--lcd-text);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
  border-top: 1px solid var(--border-s);
}
.thinking-wrap.open .thinking-body { display: block; }

.msg-time {
  font-size: 11px;
  color: var(--text-light);
  padding: 0 4px;
}
.msg.user .msg-time { text-align: right; }

/* retry notice */
.retry-notice {
  align-self: center;
  font-size: 12px;
  color: var(--accent-gold);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
}

/* ── INPUT ── */
footer {
  padding: 10px 14px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 8px var(--sh-subtle);
  flex-shrink: 0;
}
.input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border-s);
  border-radius: var(--r);
  padding: 8px 8px 8px 14px;
  box-shadow: inset 1px 1px 3px var(--sh-dark), inset -1px -1px 2px var(--sh-light);
}
#input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  resize: none;
  max-height: 120px;
  min-height: 24px;
  line-height: 1.5;
  field-sizing: content;
}
#input::placeholder { color: var(--text-light); }
#send-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #FAF8F3;
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(184,92,60,0.35);
  transition: all 0.15s;
  font-size: 16px;
}
#send-btn:disabled { background: var(--border-s); box-shadow: none; cursor: default; }
#send-btn:not(:disabled):active { transform: scale(0.92); }

/* ── AUTH SCREEN ── */
#auth-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  padding: 32px;
  z-index: 100;
}
#auth-screen.hidden { display: none; }
.auth-logo { font-size: 48px; }
.auth-title { font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing:0.08em; }
.auth-input {
  width: 100%; max-width: 300px;
  padding: 12px 16px;
  border: 1px solid var(--border-s);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-family: inherit; font-size: 15px;
  color: var(--text);
  outline: none;
  box-shadow: inset 1px 1px 3px var(--sh-dark);
}
.auth-btn {
  width: 100%; max-width: 300px;
  padding: 12px;
  background: var(--accent);
  color: #FAF8F3;
  border: none;
  border-radius: var(--r-sm);
  font-family: inherit; font-size: 15px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(184,92,60,0.3);
}
.auth-hint { font-size: 12px; color: var(--text-light); text-align:center; }

/* ── SETTINGS PANEL ── */
#settings {
  position: fixed; inset: 0;
  background: rgba(44,42,38,0.5);
  display: flex; align-items: flex-end;
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
#settings.open { opacity: 1; pointer-events: auto; }
.settings-sheet {
  width: 100%; max-width: 640px; margin: 0 auto;
  background: var(--surface);
  border-radius: var(--r) var(--r) 0 0;
  padding: 20px 20px max(20px,env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.25s ease;
  display: flex; flex-direction:column; gap:14px;
}
#settings.open .settings-sheet { transform: none; }
.settings-title { font-size: 15px; font-weight:600; color:var(--text-dim); letter-spacing:0.05em; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; color: var(--text);
}
.settings-row select, .settings-row input[type=text] {
  background: var(--surface2);
  border: 1px solid var(--border-s);
  border-radius: 8px;
  padding: 6px 10px;
  font-family: inherit; font-size: 13px;
  color: var(--text);
  outline: none;
}
.danger-btn {
  width: 100%;
  padding: 11px;
  background: #BE5A41;
  color: #FAF8F3;
  border: none;
  border-radius: var(--r-sm);
  font-family: inherit; font-size: 14px;
  cursor: pointer;
  margin-top: 6px;
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-logo">🧠</div>
  <div class="auth-title">OMBRE</div>
  <input class="auth-input" id="auth-input" type="password" placeholder="访问密钥" autocomplete="current-password">
  <button class="auth-btn" id="auth-btn">进入</button>
  <div class="auth-hint">在服务器 CHAT_SECRET 环境变量中设置密钥<br>留空则不需要密钥</div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#FAF8F3"/>
      <path d="M 16 6 A 10 10 0 0 0 16 26 Z" fill="#B85C3C"/>
      <path d="M 16 6 A 10 10 0 0 1 16 26 Z" fill="#E8DFCC"/>
      <g stroke="#B85C3C" stroke-width="0.8" stroke-opacity="0.7" fill="none">
        <circle cx="16" cy="16" r="10"/>
        <line x1="16" y1="16" x2="26" y2="16"/>
        <line x1="16" y1="6" x2="16" y2="26"/>
      </g>
    </svg>
    Ombre
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-label" style="font-size:12px;color:var(--text-light)">待机</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="settings-btn" title="设置">⚙</button>
  </div>
</header>

<!-- MESSAGES -->
<div id="messages"></div>

<!-- INPUT -->
<footer>
  <div class="input-row">
    <textarea id="input" placeholder="说点什么…" rows="1"></textarea>
    <button id="send-btn">↑</button>
  </div>
</footer>

<!-- SETTINGS PANEL -->
<div id="settings">
  <div class="settings-sheet">
    <div class="settings-title">设置</div>
    <div class="settings-row">
      <span>服务地址</span>
      <input type="text" id="cfg-host" placeholder="https://your-server.com" style="width:190px">
    </div>
    <div class="settings-row">
      <span>访问密钥</span>
      <input type="text" id="cfg-secret" placeholder="留空则无需密钥" style="width:190px">
    </div>
    <button class="auth-btn" id="cfg-save" style="margin-top:4px">保存</button>
    <button class="danger-btn" id="new-session-btn">🔄 新会话（清除上下文）</button>
    <button class="danger-btn" id="clear-history-btn" style="background:#6E695E">🗑 清除本地聊天记录</button>
  </div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
function uuid() {
  // crypto.randomUUID() 需要 HTTPS；这个兼容 HTTP
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const cfg = {
  host:   localStorage.getItem('ombre_host')   || location.origin,
  secret: localStorage.getItem('ombre_secret') || '',
};
let chatId = localStorage.getItem('ombre_chatid') || uuid();
localStorage.setItem('ombre_chatid', chatId);

// ── AUTH ─────────────────────────────────────────────────────────────────────
const authScreen = document.getElementById('auth-screen');
if (cfg.secret) authScreen.classList.add('hidden');
document.getElementById('auth-btn').onclick = () => {
  cfg.secret = document.getElementById('auth-input').value.trim();
  localStorage.setItem('ombre_secret', cfg.secret);
  authScreen.classList.add('hidden');
};
document.getElementById('auth-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

// ── STATE ────────────────────────────────────────────────────────────────────
let isGenerating = false;
let history = JSON.parse(localStorage.getItem(`ombre_hist_${chatId}`) || '[]');

// ── SETTINGS PANEL ───────────────────────────────────────────────────────────
const settingsEl = document.getElementById('settings');
document.getElementById('settings-btn').onclick = () => {
  document.getElementById('cfg-host').value   = cfg.host;
  document.getElementById('cfg-secret').value = cfg.secret;
  settingsEl.classList.add('open');
};
settingsEl.addEventListener('click', e => { if (e.target === settingsEl) settingsEl.classList.remove('open'); });
document.getElementById('cfg-save').onclick = () => {
  cfg.host   = document.getElementById('cfg-host').value.trim()   || location.origin;
  cfg.secret = document.getElementById('cfg-secret').value.trim();
  localStorage.setItem('ombre_host',   cfg.host);
  localStorage.setItem('ombre_secret', cfg.secret);
  settingsEl.classList.remove('open');
};
document.getElementById('new-session-btn').onclick = () => {
  if (!confirm('开始新会话，Claude 将失去本次对话记忆（Ombre Brain 长期记忆保留）')) return;
  fetch(`${cfg.host}/api/session/${chatId}`, {
    method: 'DELETE',
    headers: cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {},
  }).catch(() => {});
  chatId = uuid();
  localStorage.setItem('ombre_chatid', chatId);
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  settingsEl.classList.remove('open');
  setStatus('idle');
};
document.getElementById('clear-history-btn').onclick = () => {
  if (!confirm('清除本地聊天记录显示？（不影响 Claude 进程内记忆）')) return;
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  settingsEl.classList.remove('open');
};

// ── HELPERS ──────────────────────────────────────────────────────────────────
function saveHistory() {
  localStorage.setItem(`ombre_hist_${chatId}`, JSON.stringify(history.slice(-200)));
}

function setStatus(s) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  dot.className = 'status-dot ' + (s === 'idle' ? '' : s);
  label.textContent = { idle:'待机', active:'连接中', thinking:'思考中', error:'错误' }[s] || s;
}

function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}

function appendMsg(role, text, thinking, time) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

  if (thinking) {
    const tw = document.createElement('div');
    tw.className = 'thinking-wrap';
    tw.innerHTML = `
      <div class="thinking-hdr"><span class="arr">▶</span> 思考过程</div>
      <div class="thinking-body">${escHtml(thinking)}</div>`;
    tw.querySelector('.thinking-hdr').onclick = () => tw.classList.toggle('open');
    wrap.appendChild(tw);
  }

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  wrap.appendChild(bub);

  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = time || now();
  wrap.appendChild(t);

  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return bub;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── RENDER HISTORY ────────────────────────────────────────────────────────────
history.forEach(m => appendMsg(m.role, m.text, m.thinking, m.time));

// ── SEND ─────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || isGenerating) return;

  input.value = '';
  input.style.height = '';
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;

  const userTime = now();
  appendMsg('user', text, null, userTime);
  history.push({ role:'user', text, time: userTime });
  saveHistory();

  setStatus('active');

  // 创建 AI 消息气泡
  const msgs = document.getElementById('messages');
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg ai';
  const aiBub = document.createElement('div');
  aiBub.className = 'bubble streaming';
  aiWrap.appendChild(aiBub);
  msgs.appendChild(aiWrap);
  msgs.scrollTop = msgs.scrollHeight;

  let fullText    = '';
  let thinkingTxt = '';
  let thinkingWrap = null;
  let thinkingBody = null;
  let inThinking   = false;

  try {
    const res = await fetch(`${cfg.host}/api/chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body: JSON.stringify({ chatId, text }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf      = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      // SSE: 按双换行拆事件
      const parts = buf.split('\n\n');
      buf = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        handleEvent(ev);
      }
    }
  } catch (err) {
    aiBub.textContent = `⚠ 连接失败：${err.message}`;
    aiBub.classList.remove('streaming');
    setStatus('error');
    isGenerating = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  function handleEvent(ev) {
    // 思考中状态
    if (ev.type === 'stream_event') {
      const delta = ev.event?.delta;
      if (!delta) return;

      if (delta.type === 'thinking_delta' && delta.thinking) {
        setStatus('thinking');
        thinkingTxt += delta.thinking;
        if (!thinkingWrap) {
          thinkingWrap = document.createElement('div');
          thinkingWrap.className = 'thinking-wrap open';
          thinkingBody = document.createElement('div');
          thinkingBody.className = 'thinking-body';
          const hdr = document.createElement('div');
          hdr.className = 'thinking-hdr';
          hdr.innerHTML = '<span class="arr">▶</span> 思考中…';
          hdr.onclick = () => thinkingWrap.classList.toggle('open');
          thinkingWrap.appendChild(hdr);
          thinkingWrap.appendChild(thinkingBody);
          aiWrap.insertBefore(thinkingWrap, aiBub);
        }
        thinkingBody.textContent = thinkingTxt;
        msgs.scrollTop = msgs.scrollHeight;
      }

      if (delta.type === 'text_delta' && delta.text) {
        setStatus('active');
        fullText += delta.text;
        aiBub.textContent = fullText;
        msgs.scrollTop = msgs.scrollHeight;
      }
    }

    // 限流提示
    if (ev.type === 'system/api_retry') {
      const notice = document.createElement('div');
      notice.className = 'retry-notice';
      notice.textContent = `⏳ 限流中，${(ev.retry_delay_ms/1000).toFixed(0)}s 后重试…`;
      msgs.insertBefore(notice, aiWrap);
      setTimeout(() => notice.remove(), (ev.retry_delay_ms || 5000) + 500);
    }

    // 一轮结束
    if (ev.type === 'result') {
      aiBub.classList.remove('streaming');
      const aiTime = now();
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = aiTime;
      aiWrap.appendChild(timeEl);

      history.push({ role:'ai', text: fullText, thinking: thinkingTxt || null, time: aiTime });
      saveHistory();

      setStatus('idle');
      isGenerating = false;
      document.getElementById('send-btn').disabled = false;
    }
  }
}

// ── INPUT EVENTS ──────────────────────────────────────────────────────────────
document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
