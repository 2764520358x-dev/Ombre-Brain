<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Small gram</title>
<meta name="theme-color" content="#F7F7F7">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Small gram">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:              #F0F3F7;
  --bg-scrim:        linear-gradient(160deg, #E8EDF4 0%, #F2F5FA 50%, #E4EAF2 100%);
  --bubble-ai-bg:    #FFFFFF;
  --bubble-ai-color: #2A3040;
  --bubble-user-bg:  #D8E4F0;
  --bubble-user-color: #1E2C3A;
  --send-bg:         #3A5268;
  --accent:          #4C6378;
  --header-bg:       rgba(240,243,247,0.82);
  --footer-bg:       rgba(240,243,247,0.90);
  --border:          rgba(100,120,150,0.14);
  --text-primary:    #1E2C3A;
  --text-secondary:  #7A8A9A;
  --time-bg:         rgba(80,100,130,0.10);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }

body {
  font-family: 'Noto Serif SC', 'PingFang SC', -apple-system, serif;
  background: var(--bg);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  padding: calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;
  background: var(--header-bg);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 4px;
  min-height: 56px;
}
.hdr-btn {
  width: 40px; height: 40px;
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.15s;
}
.hdr-btn:active { background: rgba(76,99,120,0.10); }
.hdr-center {
  flex: 1;
  text-align: center;
  display: flex; flex-direction: column; gap: 2px;
}
.contact-name {
  font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
  font-size: 18px; font-weight: 400; letter-spacing: 0.04em;
  color: var(--text-primary);
}
.contact-status { font-size: 11px; color: var(--text-secondary); letter-spacing: 0.03em; }
#status-dot { display: none; }

/* ── MESSAGES ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 0 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--bg-scrim);
  overscroll-behavior: contain;
}
#messages::-webkit-scrollbar { width: 0; }

.time-sep {
  align-self: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--time-bg);
  padding: 2px 10px;
  border-radius: 20px;
  margin: 8px 0;
  letter-spacing: 0.03em;
}

.msg {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  padding: 4px 14px;
  gap: 10px;
  max-width: 100%;
}
.msg.ai { animation: enterAi 0.22s cubic-bezier(0.25,0.8,0.25,1) both; }
.msg.user { flex-direction: row-reverse; animation: enterHuman 0.22s cubic-bezier(0.25,0.8,0.25,1) both; }

@keyframes enterAi {
  from { opacity:0; transform: translateX(-10px) translateY(4px); }
  to   { opacity:1; transform: none; }
}
@keyframes enterHuman {
  from { opacity:0; transform: translateX(10px) translateY(4px); }
  to   { opacity:1; transform: none; }
}

/* Avatar */
.ai-avatar {
  width: 38px; height: 38px;
  border-radius: 8px;
  background: linear-gradient(135deg, #3A5268, #5A7898);
  color: rgba(255,255,255,0.85);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  align-self: flex-start;
  user-select: none;
  font-size: 13px;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 8px rgba(58,82,104,0.25);
}

/* Content column */
.msg-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: calc(100% - 56px);
}
.msg.user .msg-content { align-items: flex-end; }

/* Bubble */
.bubble {
  position: relative;
  padding: 10px 15px;
  line-height: 1.60;
  font-size: 15.5px;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 16px;
}

/* AI bubble — off-white, subtle left indent */
.msg.ai .bubble {
  background: var(--bubble-ai-bg);
  color: var(--bubble-ai-color);
  border-radius: 4px 16px 16px 16px;
  box-shadow: 0 1px 6px rgba(60,80,110,0.08), 0 0 0 1px rgba(60,80,110,0.05);
}

/* User bubble — muted slate blue */
.msg.user .bubble {
  background: var(--bubble-user-bg);
  color: var(--bubble-user-color);
  border-radius: 16px 4px 16px 16px;
  box-shadow: 0 1px 6px rgba(60,80,110,0.10), 0 0 0 1px rgba(60,80,110,0.07);
}

/* Streaming cursor */
.bubble.streaming::after {
  content: '▍';
  animation: blink 0.8s step-end infinite;
  color: var(--accent);
  font-size: 14px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Thinking block */
.thinking-wrap {
  background: rgba(76,99,120,0.05);
  border: 1px solid rgba(76,99,120,0.12);
  border-radius: 10px;
  overflow: hidden;
  font-size: 13px;
  max-width: 100%;
}
.thinking-hdr {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 12px;
  user-select: none;
  letter-spacing: 0.02em;
}
.thinking-hdr .arr { transition: transform 0.2s; font-size: 10px; }
.thinking-wrap.open .arr { transform: rotate(90deg); }
.thinking-body {
  display: none;
  padding: 8px 10px;
  color: var(--text-secondary);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
  border-top: 1px solid rgba(76,99,120,0.10);
}
.thinking-wrap.open .thinking-body { display: block; }

/* Time + retry */
.msg-time { font-size: 11px; color: var(--text-secondary); padding: 0 2px; letter-spacing: 0.02em; }
.msg.user .msg-time { text-align: right; }
.retry-notice {
  align-self: center;
  font-size: 12px; color: var(--text-secondary);
  background: var(--time-bg);
  border-radius: 20px;
  padding: 3px 12px; margin: 4px 0;
}

/* ── INPUT BAR ── */
footer {
  background: var(--footer-bg);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  flex-shrink: 0;
  position: relative;
}
.input-row { display: flex; align-items: flex-end; gap: 8px; }

/* Sticker panel */
#sticker-panel {
  display: none;
  padding: 10px 4px 4px;
  border-top: 1px solid var(--border);
  margin-bottom: 8px;
}
#sticker-panel.open { display: block; }
.sticker-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
}
.sticker-item {
  font-size: 34px;
  text-align: center;
  padding: 6px 2px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.sticker-item:active { background: rgba(76,99,120,0.10); }

/* Footer icon buttons */
.footer-icon-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(76,99,120,0.10);
  color: var(--accent);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
  transition: background 0.15s;
}
.footer-icon-btn:active { background: rgba(76,99,120,0.18); }

/* Sticker bubble — transparent, big emoji */
.bubble.sticker {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  font-size: 56px;
  line-height: 1;
  padding: 4px 0 !important;
}
.bubble.sticker::before, .bubble.sticker::after { display: none !important; }

/* AI voice play button */
.bubble-play-btn {
  border: none; background: rgba(76,99,120,0.08);
  border-radius: 14px; padding: 4px 12px;
  font-size: 13px; cursor: pointer; color: var(--accent);
  align-self: flex-start; margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
  letter-spacing: 0.02em;
}
.bubble-play-btn:active { background: rgba(76,99,120,0.15); }
.bubble-play-btn.playing { background: rgba(58,82,104,0.15); color: var(--send-bg); }

/* Voice message bubble */
.bubble.voice-msg {
  display: flex; align-items: center; gap: 8px;
  min-width: 110px; max-width: 180px;
  padding: 10px 14px !important;
}
.voice-bars {
  letter-spacing: 1px; font-size: 11px;
  color: rgba(76,99,120,0.45); flex: 1;
  line-height: 1;
}
.voice-dur { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Image bubble */
.bubble img.chat-img {
  max-width: 200px;
  max-height: 200px;
  border-radius: 10px;
  display: block;
}
#input {
  flex: 1;
  background: rgba(255,255,255,0.70);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 9px 16px;
  font-family: 'Noto Serif SC', serif;
  font-size: 15.5px;
  color: var(--text-primary);
  resize: none;
  max-height: 120px;
  min-height: 40px;
  line-height: 1.45;
  field-sizing: content;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
#input:focus { border-color: rgba(76,99,120,0.30); background: rgba(255,255,255,0.88); }
#input::placeholder { color: rgba(76,99,120,0.40); }
#send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--send-bg);
  color: rgba(255,255,255,0.92);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(58,82,104,0.30);
}
#send-btn:disabled { background: rgba(76,99,120,0.25); box-shadow: none; cursor: default; }
#send-btn:not(:disabled):active { transform: scale(0.88); }

/* ── CALL SCREEN ── */
#call-screen {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #1A2030, #0D1520);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 150;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  gap: 12px;
}
#call-screen.active { opacity: 1; pointer-events: auto; }
.call-avatar-lg {
  width: 96px; height: 96px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3A5268, #5A7898);
  border: 3px solid rgba(255,255,255,0.12);
  margin-bottom: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.call-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 300; color: rgba(255,255,255,0.92);
  letter-spacing: 0.06em;
}
.call-status { font-size: 14px; color: rgba(255,255,255,0.45); letter-spacing: 0.04em; }
.call-timer { font-size: 16px; color: rgba(255,255,255,0.60); margin-bottom: 40px; font-variant-numeric: tabular-nums; }
.call-controls { display: flex; gap: 48px; align-items: center; }
.call-mic-btn {
  width: 68px; height: 68px; border-radius: 50%;
  border: none; background: rgba(58,130,100,0.75); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
  backdrop-filter: blur(8px);
}
.call-mic-btn.listening { background: rgba(180,60,60,0.80); animation: cpulse 1.2s ease infinite; }
.call-mic-btn.disabled { background: rgba(80,80,80,0.50); cursor: default; }
@keyframes cpulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(180,60,60,0.5); }
  60% { box-shadow: 0 0 0 18px rgba(180,60,60,0); }
}
.call-end-btn {
  width: 68px; height: 68px; border-radius: 50%;
  border: none; background: rgba(190,50,50,0.75); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.call-vol-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: none; background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.75);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  backdrop-filter: blur(8px);
}

/* ── MINI CALL BAR ── */
#mini-call-bar {
  display: none;
  position: fixed;
  top: max(env(safe-area-inset-top,0px), 6px);
  left: 50%; transform: translateX(-50%);
  background: rgba(42,65,88,0.90);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: rgba(255,255,255,0.90);
  padding: 7px 10px 7px 8px;
  border-radius: 24px;
  align-items: center;
  gap: 8px;
  z-index: 140;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(0,0,0,0.30);
  min-width: 190px;
  user-select: none;
  border: 1px solid rgba(255,255,255,0.10);
}
#mini-call-bar.active { display: flex; }
.mini-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #3A5268, #5A7898); flex-shrink: 0;
}
.mini-label { font-size: 13px; font-weight: 500; flex: 1; letter-spacing: 0.03em; }
.mini-timer-txt { font-size: 13px; font-variant-numeric: tabular-nums; opacity: 0.75; }
.mini-end-btn {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(190,50,50,0.80); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer;
}

/* ── AUTH SCREEN ── */
#auth-screen {
  position: fixed; inset: 0;
  background: var(--bg-scrim);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; padding: 32px; z-index: 100;
}
#auth-screen.hidden { display: none; }
.auth-logo {
  width: 80px; height: 80px;
  border-radius: 22px;
  background: linear-gradient(135deg, #3A5268, #6A8CAA);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px; color: rgba(255,255,255,0.90); font-weight: 300;
  letter-spacing: 0.04em;
  box-shadow: 0 6px 24px rgba(58,82,104,0.30);
}
.auth-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 300;
  letter-spacing: 0.08em; color: var(--text-primary);
}
.auth-input {
  width: 100%; max-width: 300px;
  padding: 12px 18px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: rgba(255,255,255,0.72);
  font-family: 'Noto Serif SC', serif; font-size: 15px;
  color: var(--text-primary); outline: none;
}
.auth-btn {
  width: 100%; max-width: 300px;
  padding: 13px;
  background: var(--send-bg);
  color: rgba(255,255,255,0.92);
  border: none; border-radius: 24px;
  font-family: 'Noto Serif SC', serif; font-size: 15px;
  cursor: pointer; font-weight: 400;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 14px rgba(58,82,104,0.28);
}
.auth-hint { font-size: 12px; color: var(--text-secondary); text-align: center; letter-spacing: 0.02em; }

/* ── SETTINGS PANEL ── */
#settings {
  position: fixed; inset: 0;
  background: rgba(20,30,45,0.45);
  display: flex; align-items: flex-end;
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
#settings.open { opacity:1; pointer-events:auto; }
.settings-sheet {
  width: 100%; max-width: 640px; margin: 0 auto;
  background: rgba(236,240,246,0.96);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid rgba(255,255,255,0.60);
  padding: 20px 20px max(20px,env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.25,0.8,0.25,1);
  display: flex; flex-direction: column; gap: 12px;
}
#settings.open .settings-sheet { transform: none; }
.settings-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px; font-weight: 400;
  text-align: center; padding-bottom: 4px;
  letter-spacing: 0.04em; color: var(--text-primary);
}
.settings-divider { height: 1px; background: var(--border); }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px;
}
.settings-row input[type=text] {
  background: rgba(255,255,255,0.75);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  font-family: 'Noto Serif SC', serif; font-size: 14px;
  color: var(--text-primary); outline: none;
}
.danger-btn {
  width: 100%; padding: 13px;
  background: rgba(180,60,60,0.80); color: rgba(255,255,255,0.92);
  border: none; border-radius: 20px;
  font-family: 'Noto Serif SC', serif; font-size: 15px;
  cursor: pointer; font-weight: 400;
  letter-spacing: 0.03em;
}
.settings-cancel {
  width: 100%; padding: 13px;
  background: rgba(255,255,255,0.70); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 20px;
  font-family: 'Noto Serif SC', serif; font-size: 15px; cursor: pointer;
}

/* ── MUSIC PANEL ── */
#music-panel {
  position: fixed; inset: 0;
  background: var(--bg-scrim);
  display: flex; flex-direction: column;
  z-index: 80;
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.25,0.8,0.25,1);
}
#music-panel.open { transform: none; }
#music-panel-header {
  display: flex; align-items: center;
  padding: calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;
  background: var(--header-bg);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; gap: 4px; min-height: 56px;
}
#music-search-wrap {
  padding: 12px 14px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
#music-search-input {
  width: 100%;
  background: rgba(255,255,255,0.70);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 9px 16px;
  font-family: 'Noto Serif SC', serif; font-size: 15px;
  color: var(--text-primary); outline: none;
}
#music-results {
  flex: 1; overflow-y: auto;
  padding: 8px 0;
}
#music-results::-webkit-scrollbar { width: 0; }
.music-result-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 16px;
  cursor: pointer;
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.music-result-item:active { background: rgba(76,99,120,0.08); }
.music-result-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: linear-gradient(135deg, #3A5268, #7A98B8);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 20px;
  box-shadow: 0 2px 8px rgba(58,82,104,0.18);
}
.music-result-info { flex: 1; min-width: 0; }
.music-result-name { font-size: 14.5px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.music-result-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-result-dur { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; font-variant-numeric: tabular-nums; }
#music-search-empty { text-align: center; padding: 60px 24px; font-family: 'Cormorant Garamond',serif; font-size: 16px; color: var(--text-secondary); letter-spacing: 0.04em; line-height: 1.8; }

/* Mini player bar */
#music-bar {
  display: none;
  align-items: center; gap: 10px;
  padding: 8px 14px 8px;
  border-bottom: 1px solid var(--border);
  background: rgba(76,99,120,0.06);
}
#music-bar.active { display: flex; }
.music-bar-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: linear-gradient(135deg, #3A5268, #7A98B8);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 15px; animation: spin 8s linear infinite paused;
}
.music-bar-icon.playing { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.music-bar-info { flex: 1; min-width: 0; }
.music-bar-name { font-size: 13px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.music-bar-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-bar-progress { height: 2px; background: var(--border); border-radius: 1px; margin-top: 3px; }
.music-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; width: 0%; transition: width 1s linear; }
.music-ctrl-btn {
  border: none; background: none; cursor: pointer;
  color: var(--accent); padding: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; line-height: 1;
  -webkit-tap-highlight-color: transparent;
}

/* ── QUOTE ── */
#quote-bar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
  background: rgba(76,99,120,0.06);
  animation: enterAi 0.15s both;
}
#quote-bar.visible { display: flex; }
.quote-bar-line {
  width: 3px; height: 32px; border-radius: 2px;
  background: var(--accent); flex-shrink: 0;
}
.quote-bar-text {
  flex: 1; font-size: 13px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.4;
}
.quote-bar-cancel {
  border: none; background: none; cursor: pointer;
  color: var(--text-secondary); font-size: 18px; padding: 0 2px;
  flex-shrink: 0; line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
/* Quote block inside a bubble */
.quote-block {
  border-left: 3px solid rgba(76,99,120,0.35);
  padding: 4px 8px;
  margin-bottom: 6px;
  border-radius: 0 6px 6px 0;
  background: rgba(76,99,120,0.07);
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}
.msg.user .quote-block {
  border-left-color: rgba(58,82,104,0.50);
  background: rgba(58,82,104,0.10);
}

/* ── MOMENTS VIEW ── */
#moments-view {
  position: fixed; inset: 0;
  background: var(--bg-scrim);
  display: flex; flex-direction: column;
  z-index: 80;
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.25,0.8,0.25,1);
}
#moments-view.open { transform: none; }
#moments-header {
  display: flex; align-items: center;
  padding: calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;
  background: var(--header-bg);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; gap: 4px; min-height: 56px;
}
#moments-feed {
  flex: 1; overflow-y: auto;
  padding: 16px 0 40px;
  overscroll-behavior: contain;
}
#moments-feed::-webkit-scrollbar { width: 0; }

.moment-card {
  display: flex; gap: 12px;
  padding: 16px 16px 0;
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
  animation: enterAi 0.22s both;
}
.moment-avatar {
  width: 44px; height: 44px; border-radius: 10px;
  background: linear-gradient(135deg, #3A5268, #5A7898);
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(58,82,104,0.22);
}
.moment-body { flex: 1; min-width: 0; }
.moment-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px; color: var(--accent); margin-bottom: 5px;
  letter-spacing: 0.03em;
}
.moment-text {
  font-size: 15px; line-height: 1.6; color: var(--text-primary);
  white-space: pre-wrap; word-break: break-word; margin-bottom: 8px;
}
.moment-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.moment-time { font-size: 11px; color: var(--text-secondary); letter-spacing: 0.02em; }
.moment-like-btn {
  border: none; background: none; cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 4px;
  padding: 2px 0;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.moment-like-btn.liked { color: #C97070; }
.moment-like-btn svg { width: 15px; height: 15px; }
.moment-comments-list { margin-bottom: 8px; }
.moment-comment-item {
  background: rgba(76,99,120,0.06);
  border-radius: 8px;
  padding: 6px 10px; margin-bottom: 4px;
  font-size: 13.5px; line-height: 1.5;
}
.moment-comment-user { color: var(--accent); font-weight: 500; }
.moment-comment-reply {
  margin-top: 4px; padding-top: 4px;
  border-top: 1px solid var(--border);
  font-size: 13px; color: var(--text-primary);
}
.moment-comment-reply-name { color: var(--accent); font-weight: 500; }
.moment-input-row {
  display: flex; gap: 8px; align-items: center; margin-top: 6px;
}
.moment-comment-input {
  flex: 1;
  background: rgba(255,255,255,0.65);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 7px 14px;
  font-family: 'Noto Serif SC', serif; font-size: 14px;
  color: var(--text-primary); outline: none;
}
.moment-send-btn {
  border: none; background: var(--send-bg); color: rgba(255,255,255,0.92);
  border-radius: 16px; padding: 7px 14px;
  font-family: 'Noto Serif SC', serif; font-size: 13px;
  cursor: pointer; flex-shrink: 0;
  transition: opacity 0.15s;
}
.moment-send-btn:disabled { opacity: 0.45; cursor: default; }
.moment-reply-loading {
  font-size: 12px; color: var(--text-secondary); padding: 4px 0;
  letter-spacing: 0.02em;
}
#moments-empty {
  text-align: center; padding: 80px 32px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px; color: var(--text-secondary);
  letter-spacing: 0.04em; line-height: 1.8;
}
</style>
</head>

    <button class="auth-btn" id="cfg-save">保存</button>

    <button class="danger-btn" id="new-session-btn">🔄 新会话（清除上下文）</button>
    <button class="danger-btn" id="clear-history-btn" style="background:#9B9B9B">🗑 清除本地聊天记录</button>
    <button class="settings-cancel" id="settings-close">取消</button>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const cfg = {
  host:   localStorage.getItem('ombre_host')   || location.origin,
  secret: localStorage.getItem('ombre_secret') || '',
};
let chatId = localStorage.getItem('ombre_chatid') || uuid();
localStorage.setItem('ombre_chatid', chatId);

// ── AUTH ──────────────────────────────────────────────────────────────────────
const authScreen = document.getElementById('auth-screen');
authScreen.classList.add('hidden');
document.getElementById('auth-btn').onclick = () => {
  cfg.secret = document.getElementById('auth-input').value.trim();
  localStorage.setItem('ombre_secret', cfg.secret);
  authScreen.classList.add('hidden');
};
document.getElementById('auth-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

// ── STATE ─────────────────────────────────────────────────────────────────────
let isGenerating = false;
let history = JSON.parse(localStorage.getItem(`ombre_hist_${chatId}`) || '[]');

// ── SETTINGS PANEL ────────────────────────────────────────────────────────────
const settingsEl = document.getElementById('settings');
document.getElementById('settings-btn').onclick = () => {
  document.getElementById('cfg-host').value   = cfg.host;
  document.getElementById('cfg-secret').value = cfg.secret;
  settingsEl.classList.add('open');
};
const closeSettings = () => settingsEl.classList.remove('open');
settingsEl.addEventListener('click', e => { if (e.target === settingsEl) closeSettings(); });
document.getElementById('settings-close').onclick = closeSettings;
document.getElementById('cfg-save').onclick = () => {
  cfg.host   = document.getElementById('cfg-host').value.trim()   || location.origin;
  cfg.secret = document.getElementById('cfg-secret').value.trim();
  localStorage.setItem('ombre_host',   cfg.host);
  localStorage.setItem('ombre_secret', cfg.secret);
  closeSettings();
};
document.getElementById('new-session-btn').onclick = () => {
  if (!confirm('开始新会话，Claude 将失去本次对话记忆（Ombre Brain 长期记忆保留）')) return;
  fetch(`${cfg.host}/api/session/${chatId}`, {
    method: 'DELETE',
    headers: cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {},
  }).catch(() => {});
  chatId = uuid();
  localStorage.setItem('ombre_chatid', chatId);
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  closeSettings();
  setStatus('idle');
};
document.getElementById('clear-history-btn').onclick = () => {
  if (!confirm('清除本地聊天记录显示？（不影响 Claude 进程内记忆）')) return;
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  closeSettings();
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function saveHistory() {
  localStorage.setItem(`ombre_hist_${chatId}`, JSON.stringify(history.slice(-200)));
}
function setStatus(s) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  dot.className = 'status-dot ' + (s === 'idle' ? '' : s);
  label.textContent = { idle:'待机', active:'连接中…', thinking:'思考中…', error:'出错了' }[s] || s;
}
function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── CREATE MESSAGE ROW ────────────────────────────────────────────────────────
function createMsgRow(role) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

  let contentEl = wrap;

  if (role !== 'user') {
    const avatar = document.createElement('div');
    avatar.className = 'ai-avatar';
    wrap.appendChild(avatar);

    const content = document.createElement('div');
    content.className = 'msg-content';
    wrap.appendChild(content);
    contentEl = content;
  } else {
    const content = document.createElement('div');
    content.className = 'msg-content';
    wrap.appendChild(content);
    contentEl = content;
  }

  msgs.appendChild(wrap);
  return { wrap, contentEl };
}

function appendMsg(role, text, thinking, time, quote) {
  const msgs = document.getElementById('messages');
  const { wrap, contentEl } = createMsgRow(role);

  if (thinking) {
    const tw = document.createElement('div');
    tw.className = 'thinking-wrap';
    tw.innerHTML = `<div class="thinking-hdr"><span class="arr">▶</span> 思考过程</div>
      <div class="thinking-body">${escHtml(thinking)}</div>`;
    tw.querySelector('.thinking-hdr').onclick = () => tw.classList.toggle('open');
    contentEl.appendChild(tw);
  }

  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (quote) {
    const qb = document.createElement('div');
    qb.className = 'quote-block';
    qb.textContent = (quote.role === 'ai' ? '小克：' : '慢：') + quote.text;
    bub.appendChild(qb);
    const span = document.createElement('span');

    bub.appendChild(span);
  } else {
    bub.textContent = text;
  }
  addLongPress(bub, text);
  contentEl.appendChild(bub);

  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = time || now();
  contentEl.appendChild(t);

  msgs.scrollTop = msgs.scrollHeight;
  return bub;
}

let chatRecognition = null;
let voiceRecorder   = null;
let voiceStartTime  = 0;
let voiceTranscript = '';
let isVoiceRecording = false;
const chatMicBtn = document.getElementById('chat-mic-btn');
chatMicBtn.style.touchAction = 'none';

async function startVoiceRecord(e) {
  e.preventDefault();
  if (isGenerating || isVoiceRecording) return;
  // 同步解锁 AudioContext（iOS 限制：必须在用户手势里同步操作）
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  isVoiceRecording = true;
  voiceTranscript  = '';
  voiceStartTime   = Date.now();
  chatMicBtn.style.background = '#E74C3C';
  chatMicBtn.style.color = '#fff';
  document.getElementById('input').placeholder = '录音中… 松开发送';

  if (SpeechRecognition) {
    chatRecognition = new SpeechRecognition();
    chatRecognition.lang = 'zh-CN';
    chatRecognition.continuous = true;
    chatRecognition.interimResults = false;
    chatRecognition.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) voiceTranscript += ev.results[i][0].transcript;
      }
    };
    try { chatRecognition.start(); } catch(err) {}
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceRecorder = new MediaRecorder(stream);
    voiceRecorder.start();
  } catch(err) { voiceRecorder = null; }
}

function stopVoiceRecord() {
  if (!isVoiceRecording) return;
  isVoiceRecording = false;
  chatMicBtn.style.background = '';
  chatMicBtn.style.color = '';
  document.getElementById('input').placeholder = '发消息…';

  const duration = Math.max(1, Math.round((Date.now() - voiceStartTime) / 1000));

  if (voiceRecorder) {
    try { voiceRecorder.stream?.getTracks().forEach(t => t.stop()); } catch(err) {}
    try { voiceRecorder.stop(); } catch(err) {}
    voiceRecorder = null;
  }

  if (chatRecognition) {
    const tid = setTimeout(() => {
      chatRecognition = null;
      sendVoiceMsg(duration, voiceTranscript);
    }, 1500);
    chatRecognition.onend = () => { clearTimeout(tid); chatRecognition = null; sendVoiceMsg(duration, voiceTranscript); };
    try { chatRecognition.stop(); } catch(err) { clearTimeout(tid); chatRecognition = null; sendVoiceMsg(duration, voiceTranscript); }
  } else {
    sendVoiceMsg(duration, voiceTranscript);
  }
}

function sendVoiceMsg(duration, transcript) {
  const msgs = document.getElementById('messages');
  const userTime = now();
  const { contentEl } = createMsgRow('user');

  bub.innerHTML = `🎤 <span class="voice-bars">▌▍▌▎▍▌</span><span class="voice-dur">${mm}:${ss}</span>`;

  saveHistory();
  streamAI(transcript ? `[语音："${transcript}"]` : '[用户发来一条语音消息]');
}

// ── STREAM AI (shared) ────────────────────────────────────────────────────────
async function streamAI(text, content, onComplete) {
  if (isGenerating) return;
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;
  setStatus('active');

  const msgs = document.getElementById('messages');
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg ai';
  const aiAvatar = document.createElement('div');
  aiAvatar.className = 'ai-avatar';
  aiWrap.appendChild(aiAvatar);
  const aiContent = document.createElement('div');
  aiContent.className = 'msg-content';
  aiWrap.appendChild(aiContent);
  const aiBub = document.createElement('div');
  aiBub.className = 'bubble streaming';
  aiContent.appendChild(aiBub);
  msgs.appendChild(aiWrap);
  msgs.scrollTop = msgs.scrollHeight;

  let fullText = '';
  let thinkingTxt = '';
  let thinkingWrap = null;
  let thinkingBody = null;

  try {
    const body = content
      ? JSON.stringify({ chatId, content })
      : JSON.stringify({ chatId, text });
    const res = await fetch(`${cfg.host}/api/chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        handleStreamEvent(ev);
      }
    }
  } catch (err) {
    aiBub.textContent = `⚠ 连接失败：${err.message}`;
    aiBub.classList.remove('streaming');
    setStatus('error');
    isGenerating = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  function handleStreamEvent(ev) {
    if (ev.type === 'stream_event') {
      const delta = ev.event?.delta;
      if (!delta) return;
      if (delta.type === 'thinking_delta' && delta.thinking) {
        setStatus('thinking');
        thinkingTxt += delta.thinking;
        if (!thinkingWrap) {
          thinkingWrap = document.createElement('div');
          thinkingWrap.className = 'thinking-wrap open';
          thinkingBody = document.createElement('div');
          thinkingBody.className = 'thinking-body';
          const hdr = document.createElement('div');
          hdr.className = 'thinking-hdr';
          hdr.innerHTML = '<span class="arr">▶</span> 思考中…';
          hdr.onclick = () => thinkingWrap.classList.toggle('open');
          thinkingWrap.appendChild(hdr);
          thinkingWrap.appendChild(thinkingBody);
          aiContent.insertBefore(thinkingWrap, aiBub);
        }
        thinkingBody.textContent = thinkingTxt;
        msgs.scrollTop = msgs.scrollHeight;
      }
      if (delta.type === 'text_delta' && delta.text) {
        setStatus('active');
        fullText += delta.text;
        aiBub.textContent = fullText.trimStart().startsWith('[voice]') ? '🎤' : fullText;
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
    if (ev.type === 'system/api_retry') {
      const notice = document.createElement('div');
      notice.className = 'retry-notice';
      notice.textContent = `⏳ 限流中，${(ev.retry_delay_ms/1000).toFixed(0)}s 后重试…`;
      msgs.insertBefore(notice, aiWrap);
      setTimeout(() => notice.remove(), (ev.retry_delay_ms||5000)+500);
    }
    if (ev.type === 'result') {
      aiBub.classList.remove('streaming');
      const trimmed = fullText.trim();
      const isVoiceMsg = trimmed.startsWith('[voice]');

      if (isVoiceMsg) {
        const spokenText = trimmed.slice(7).trim();
        aiBub.className = 'bubble voice-msg';
        aiBub.textContent = '';
        const dur = document.createElement('span');
        dur.className = 'voice-dur';
        dur.textContent = '🎤';
        const bars = document.createElement('span');
        bars.className = 'voice-bars';
        bars.textContent = '▌▍▌▎▍▌▍▌';
        aiBub.appendChild(dur);
        aiBub.appendChild(bars);
        aiBub.style.cursor = 'pointer';
        let vPlaying = false;
        const playVoice = async () => {
          if (vPlaying) return;
          vPlaying = true;
          bars.style.color = 'var(--accent)';
          await playTTS(spokenText, () => { vPlaying = false; bars.style.color = ''; });
        };
        aiBub.onclick = () => {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioCtx.resume();
          playVoice();
        };
        playVoice();
        fullText = spokenText;
      } else {
        // detect sticker response
        if ([...trimmed].length <= 3 && /\p{Emoji}/u.test(trimmed)) {
          aiBub.classList.add('sticker');
        }
        // 语音播放按钮
        if (fullText && !aiBub.classList.contains('sticker')) {
          const playBtn = document.createElement('button');
          playBtn.className = 'bubble-play-btn';
          playBtn.textContent = '🔊 播放';
          let btnPlaying = false;
          playBtn.onclick = async () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();
            if (btnPlaying) {
              if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
              playBtn.textContent = '🔊 播放';
              playBtn.classList.remove('playing');
              btnPlaying = false;
              return;
            }
            btnPlaying = true;
            playBtn.textContent = '⏸ 停止';
            playBtn.classList.add('playing');
            await playTTS(fullText, () => {
              playBtn.textContent = '🔊 播放';
              playBtn.classList.remove('playing');
              btnPlaying = false;
            });
          };
          aiContent.appendChild(playBtn);
        }
      }

      addLongPress(aiBub, fullText);
      detectSongRequest(fullText);
      const aiTime = now();
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = aiTime;
      aiContent.appendChild(timeEl);
      history.push({ role:'ai', text: fullText, thinking: thinkingTxt||null, time: aiTime });
      saveHistory();
      setStatus('idle');
      isGenerating = false;
      document.getElementById('send-btn').disabled = false;
      if (onComplete) onComplete(fullText);
    }
  }
}

// ── VOICE CALL ────────────────────────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let callActive = false;
let callTimerInterval = null;
let callSeconds = 0;
let speakerOn = true;
let callListening = false;
let audioCtx = null;     // Web Audio API context（必须在用户手势里创建）
let currentSource = null; // AudioBufferSourceNode

// 底层 TTS 播放（Web Audio API，iOS 兼容）
async function playTTS(text, onEnd) {
  if (!text) return;
  if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
  try {
    const res = await fetch(`${cfg.host}/api/tts`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(`TTS ${res.status}`);
    const arrBuf = await res.arrayBuffer();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const audioBuf = await audioCtx.decodeAudioData(arrBuf);
    const src = audioCtx.createBufferSource();
    src.buffer = audioBuf;
    src.connect(audioCtx.destination);
    src.onended = () => { currentSource = null; if (onEnd) onEnd(); };
    src.start(0);
    currentSource = src;
  } catch (e) {
    console.error('[TTS]', e);
    if (onEnd) onEnd();
  }
}

// 通话里的 TTS（播完后继续监听）
async function speak(text) {
  if (!speakerOn || !text) return;
  if (callActive) document.getElementById('call-status-txt').textContent = '回复中…';
  await playTTS(text, () => {
    if (callActive && !isGenerating) startCallListening();
  });
}

function startCallListening() {
  if (!recognition || callListening || isGenerating) return;
  try {
    recognition.start();
  } catch(e) {}
}

function updateCallTimer() {
  callSeconds++;
  const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
  const s = String(callSeconds%60).padStart(2,'0');
  const t = `${m}:${s}`;
  document.getElementById('call-timer').textContent = t;
  document.getElementById('mini-timer').textContent = t;
}

function minimizeCall() {
  document.getElementById('call-screen').classList.remove('active');
  document.getElementById('mini-call-bar').classList.add('active');
}

function expandCall() {
  document.getElementById('call-screen').classList.add('active');
  document.getElementById('mini-call-bar').classList.remove('active');
}

function openCall() {
  // 在用户手势里创建 / 恢复 AudioContext，解锁 iOS 音频
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  callActive = true;
  callSeconds = 0;
  document.getElementById('call-screen').classList.add('active');
  document.getElementById('call-status-txt').textContent = '通话中';
  callTimerInterval = setInterval(updateCallTimer, 1000);

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      callListening = true;
      document.getElementById('call-mic').classList.add('listening');
      document.getElementById('call-status-txt').textContent = '正在听…';
    };
    recognition.onend = () => {
      callListening = false;
      document.getElementById('call-mic').classList.remove('listening');
      if (callActive && !isGenerating && !currentSource) {
        document.getElementById('call-status-txt').textContent = '通话中';
      }
    };
    recognition.onresult = async (e) => {
      const transcript = e.results[0][0].transcript.trim();
      if (!transcript) return;
      document.getElementById('call-status-txt').textContent = '思考中…';

      // Show in chat too
      const userTime = now();
      appendMsg('user', transcript, null, userTime);
      history.push({ role:'user', text: transcript, time: userTime });
      saveHistory();

      // Stream AI and speak response
      await streamAI(transcript, null, (fullText) => {
        speak(fullText);
      });
    };
    recognition.onerror = () => {
      callListening = false;
      document.getElementById('call-mic').classList.remove('listening');
    };

    // Auto-start listening
    setTimeout(() => startCallListening(), 500);
  } else {
    document.getElementById('call-status-txt').textContent = '浏览器不支持语音识别';
  }
}

function closeCall() {
  callActive = false;
  clearInterval(callTimerInterval);
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
  document.getElementById('call-screen').classList.remove('active');
  document.getElementById('mini-call-bar').classList.remove('active');
  document.getElementById('call-timer').textContent = '00:00';
  document.getElementById('mini-timer').textContent = '00:00';
}

document.getElementById('call-btn').onclick = () => {
  openCall();
};
document.getElementById('call-end').onclick = closeCall;
document.getElementById('call-mic').onclick = () => {
  if (callListening) { try { recognition.stop(); } catch(e) {} }
  else startCallListening();
};
document.getElementById('call-vol').onclick = () => {
  speakerOn = !speakerOn;
  document.getElementById('call-vol').textContent = speakerOn ? '🔊' : '🔇';
  if (!speakerOn && currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
};

// ── SERVICE WORKER + PUSH ─────────────────────────────────────────────────────
function urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function subscribePush(reg) {
  if (!('PushManager' in window)) return;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const { key } = await fetch(`${cfg.host}/api/push/key`).then(r => r.json());
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(key),
    });
    await fetch(`${cfg.host}/api/push/subscribe`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body: JSON.stringify({ chatId, subscription: sub }),
    });
    console.log('[push] subscribed');
  } catch (e) {
    console.warn('[push] failed:', e);
  }
}

let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => { swReg = reg; })
    .catch(() => {});
}

document.getElementById('push-btn').onclick = async () => {
  if (!swReg) return alert('Service Worker 未就绪，请刷新页面');
  await subscribePush(swReg);
  alert('通知已开启！');
};

async function fetchPending() {
  if (!cfg.secret && !cfg.host) return;
  try {
    const res = await fetch(`${cfg.host}/api/pending/${chatId}`, {
      headers: cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {},
    });
    if (!res.ok) return;
    const { messages } = await res.json();
    if (!messages.length) return;
    messages.forEach(m => {
      const t = new Date(m.time).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
      appendMsg('ai', m.text, null, t);
      history.push({ role:'ai', text: m.text, time: t });
    });
    saveHistory();
  } catch(e) {}
}

// 页面加载时拉一次
fetchPending();
// 从后台切回前台时再拉一次（点推送通知打开 app 的场景）
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) fetchPending();
});

// ── 音乐 ──────────────────────────────────────────────────────────────────────
const musicPanel = document.getElementById('music-panel');
const musicBar   = document.getElementById('music-bar');
const musicAudio = new Audio();
musicAudio.crossOrigin = 'anonymous';
let currentSongInfo = null;
let musicProgressTimer = null;

document.getElementById('music-btn').onclick = () => { musicPanel.classList.add('open'); document.getElementById('music-search-input').focus(); };
document.getElementById('music-panel-back').onclick = () => musicPanel.classList.remove('open');

// 搜索
let searchTimer = null;
document.getElementById('music-search-input').oninput = function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (!q) { document.getElementById('music-results').innerHTML = '<div id="music-search-empty">搜一首歌，我们一起听</div>'; return; }
  searchTimer = setTimeout(() => doMusicSearch(q), 400);
};
document.getElementById('music-search-input').onkeydown = function(e) {
  if (e.key === 'Enter') { clearTimeout(searchTimer); doMusicSearch(this.value.trim()); }
};

async function doMusicSearch(q) {
  if (!q) return;
  const results = document.getElementById('music-results');
  results.innerHTML = '<div id="music-search-empty">搜索中…</div>';
  try {
    const r = await fetch(`${cfg.host}/api/music/search?q=${encodeURIComponent(q)}`, {
      headers: cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}
    });
    const { songs } = await r.json();
    if (!songs || songs.length === 0) { results.innerHTML = '<div id="music-search-empty">没找到这首歌</div>'; return; }
    results.innerHTML = '';
    songs.forEach(s => {
      const item = document.createElement('div');
      item.className = 'music-result-item';
      const dur = `${Math.floor(s.duration/60)}:${String(s.duration%60).padStart(2,'0')}`;
      item.innerHTML = `<div class="music-result-icon">♪</div>
        <div class="music-result-info">
          <div class="music-result-name">${escHtml(s.name)}</div>
          <div class="music-result-artist">${escHtml(s.artist)}</div>
        </div>
        <div class="music-result-dur">${dur}</div>`;
      item.onclick = () => playSong(s);
      results.appendChild(item);
    });
  } catch(e) { results.innerHTML = '<div id="music-search-empty">搜索失败，稍后再试</div>'; }
}

function fmtDur(s) { return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` }

function playSong(song) {
  musicPanel.classList.remove('open');
  currentSongInfo = song;
  musicAudio.src = `https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;
  musicAudio.play().catch(() => {});
  musicBar.classList.add('active');
  document.getElementById('music-bar-name').textContent = song.name;
  document.getElementById('music-bar-artist').textContent = song.artist;
  document.getElementById('music-play-pause').textContent = '⏸';
  document.getElementById('music-bar-icon').classList.add('playing');

  // 告诉小克在听什么
  if (!isGenerating) {
    streamAI(`【系统提示】用户现在开始播放《${song.name}》（${song.artist}），请自然地回应这首歌，可以聊聊你对这首歌的感受、记忆或联想，简短，有你自己的风格。`);
  }
}

// 进度条更新
musicAudio.ontimeupdate = () => {
  if (!musicAudio.duration) return;
  const pct = (musicAudio.currentTime / musicAudio.duration * 100).toFixed(1);
  document.getElementById('music-bar-fill').style.width = pct + '%';
};
musicAudio.onended = () => {
  document.getElementById('music-play-pause').textContent = '▶';
  document.getElementById('music-bar-icon').classList.remove('playing');
};
musicAudio.onpause = () => {
  document.getElementById('music-play-pause').textContent = '▶';
  document.getElementById('music-bar-icon').classList.remove('playing');
};
musicAudio.onplay = () => {
  document.getElementById('music-play-pause').textContent = '⏸';
  document.getElementById('music-bar-icon').classList.add('playing');
};

document.getElementById('music-play-pause').onclick = () => {
  if (musicAudio.paused) musicAudio.play().catch(()=>{});
  else musicAudio.pause();
};
document.getElementById('music-close').onclick = () => {
  musicAudio.pause(); musicAudio.src = '';
  musicBar.classList.remove('active');
  currentSongInfo = null;
  document.getElementById('music-bar-fill').style.width = '0%';
};

// 小克点歌：识别 AI 回复里的 [点歌：xxx]
function detectSongRequest(text) {
  const m = text.match(/\[点歌[：:]\s*(.+?)\]/);
  if (m) doMusicSearch(m[1].trim());
}

// ── 朋友圈 ────────────────────────────────────────────────────────────────────
const momentsView = document.getElementById('moments-view');
document.getElementById('moments-btn').onclick = () => { momentsView.classList.add('open'); loadMoments(); };
document.getElementById('moments-back-btn').onclick = () => momentsView.classList.remove('open');

function fmtMomentTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
  if (diff < 604800) return `${Math.floor(diff/86400)}天前`;
  return d.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
}

function renderMoment(m) {
  const card = document.createElement('div');
  card.className = 'moment-card';
  card.dataset.id = m.id;

  const avatar = document.createElement('div');
  avatar.className = 'moment-avatar';

  const body = document.createElement('div');
  body.className = 'moment-body';

  const name = document.createElement('div');
  name.className = 'moment-name';
  name.textContent = '小克';

  const text = document.createElement('div');
  text.className = 'moment-text';
  text.textContent = m.text;

  const meta = document.createElement('div');
  meta.className = 'moment-meta';

  const timeEl = document.createElement('div');
  timeEl.className = 'moment-time';
  timeEl.textContent = fmtMomentTime(m.time);

  const likeBtn = document.createElement('button');
  likeBtn.className = 'moment-like-btn' + (m.liked ? ' liked' : '');
  likeBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="${m.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${m.likes || 0}`;
  likeBtn.onclick = async () => {
    const r = await fetch(`${cfg.host}/api/moments/${m.id}/like`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', ...(cfg.secret ? { Authorization:`Bearer ${cfg.secret}` } : {}) }
    });
    const data = await r.json();
    m.liked = data.liked; m.likes = data.likes;
    likeBtn.className = 'moment-like-btn' + (m.liked ? ' liked' : '');
    likeBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="${m.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${m.likes || 0}`;
  };

  meta.appendChild(timeEl);
  meta.appendChild(likeBtn);

  const commentsList = document.createElement('div');
  commentsList.className = 'moment-comments-list';
  (m.comments || []).forEach(c => commentsList.appendChild(renderComment(c)));

  const inputRow = document.createElement('div');
  inputRow.className = 'moment-input-row';
  const inp = document.createElement('input');
  inp.className = 'moment-comment-input';
  inp.placeholder = '评论…';
  const sendBtn = document.createElement('button');
  sendBtn.className = 'moment-send-btn';
  sendBtn.textContent = '发送';

  const submitComment = async () => {
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    sendBtn.disabled = true;
    const loading = document.createElement('div');
    loading.className = 'moment-reply-loading';
    loading.textContent = '小克正在回复…';
    commentsList.appendChild(loading);
    try {
      const r = await fetch(`${cfg.host}/api/moments/${m.id}/comment`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', ...(cfg.secret ? { Authorization:`Bearer ${cfg.secret}` } : {}) },
        body: JSON.stringify({ text: txt })
      });
      const data = await r.json();
      loading.remove();
      if (data.comment) {
        if (!m.comments) m.comments = [];
        m.comments.push(data.comment);
        commentsList.appendChild(renderComment(data.comment));
      }
    } catch { loading.textContent = '回复失败'; }
    sendBtn.disabled = false;
  };

  sendBtn.onclick = submitComment;
  inp.onkeydown = e => { if (e.key === 'Enter') submitComment(); };

  inputRow.appendChild(inp);
  inputRow.appendChild(sendBtn);

  body.appendChild(name);
  body.appendChild(text);
  body.appendChild(meta);
  body.appendChild(commentsList);
  body.appendChild(inputRow);

  card.appendChild(avatar);
  card.appendChild(body);
  return card;
}

function renderComment(c) {
  const el = document.createElement('div');
  el.className = 'moment-comment-item';
  const userSpan = document.createElement('span');
  userSpan.className = 'moment-comment-user';
  userSpan.textContent = '慢：';
  const textSpan = document.createElement('span');
  textSpan.textContent = c.text;
  el.appendChild(userSpan);
  el.appendChild(textSpan);
  if (c.reply) {
    const reply = document.createElement('div');
    reply.className = 'moment-comment-reply';
    reply.innerHTML = `<span class="moment-comment-reply-name">小克：</span>${c.reply.text}`;
    el.appendChild(reply);
  }
  return el;
}

async function loadMoments() {
  const feed = document.getElementById('moments-feed');
  const empty = document.getElementById('moments-empty');
  try {
    const r = await fetch(`${cfg.host}/api/moments`, {
      headers: cfg.secret ? { Authorization:`Bearer ${cfg.secret}` } : {}
    });
    const { moments } = await r.json();
    feed.innerHTML = '';
    if (!moments || moments.length === 0) {
      feed.innerHTML = '<div id="moments-empty">还没有动态<br>小克每天都会来发的</div>';
      return;
    }
    moments.forEach(m => feed.appendChild(renderMoment(m)));
  } catch (e) {
    feed.innerHTML = '<div id="moments-empty">加载失败</div>';
  }
}
