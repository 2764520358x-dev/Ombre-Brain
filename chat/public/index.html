<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>阴影</title>
<meta name="theme-color" content="#F7F7F7">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ombre">
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }

body {
  font-family: 'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background: #EDEDED;
  color: #181818;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  padding: calc(env(safe-area-inset-top,0px) + 10px) 8px 10px;
  background: #F7F7F7;
  border-bottom: 1px solid #D0D0D0;
  flex-shrink: 0;
  gap: 4px;
  min-height: 56px;
}
.hdr-btn {
  width: 40px; height: 40px;
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #181818;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.15s;
}
.hdr-btn:active { background: rgba(0,0,0,0.08); }
.hdr-center {
  flex: 1;
  text-align: center;
  display: flex; flex-direction: column; gap: 2px;
}
.contact-name { font-size: 17px; font-weight: 600; }
.contact-status { font-size: 12px; color: #9B9B9B; }
#status-dot { display: none; }

/* ── MESSAGES ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: #EDEDED;
  overscroll-behavior: contain;
}
#messages::-webkit-scrollbar { width: 0; }

.time-sep {
  align-self: center;
  font-size: 11px;
  color: #9B9B9B;
  background: rgba(0,0,0,0.07);
  padding: 2px 8px;
  border-radius: 3px;
  margin: 6px 0;
}

.msg {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  padding: 4px 12px;
  gap: 8px;
  max-width: 100%;
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

.msg.user { flex-direction: row-reverse; }

/* Avatar */
.ai-avatar {
  width: 40px; height: 40px;
  border-radius: 6px;
  background: #1A1A1A;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  align-self: flex-start;
  user-select: none;
}

/* Content column */
.msg-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: calc(100% - 56px);
}
.msg.user .msg-content { align-items: flex-end; }

/* Bubble */
.bubble {
  position: relative;
  padding: 10px 14px;
  line-height: 1.55;
  font-size: 16px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* AI bubble — white, top-left tail */
.msg.ai .bubble {
  background: #FFF;
  color: #181818;
  border-radius: 0 8px 8px 8px;
}
.msg.ai .bubble::before {
  content: '';
  position: absolute;
  left: -8px; top: 0;
  border-right: 8px solid #FFF;
  border-bottom: 8px solid transparent;
}

/* User bubble — WeChat green, top-right tail */
.msg.user .bubble {
  background: #95EC69;
  color: #181818;
  border-radius: 8px 0 8px 8px;
}
.msg.user .bubble::after {
  content: '';
  position: absolute;
  right: -8px; top: 0;
  border-left: 8px solid #95EC69;
  border-bottom: 8px solid transparent;
}

/* Streaming cursor */
.bubble.streaming::after {
  content: '|';
  animation: blink 0.7s step-end infinite;
  color: rgba(0,0,0,0.35);
  font-weight: 300;
}
/* Override user bubble ::after when streaming */
.msg.user .bubble.streaming::after {
  right: auto; top: auto;
  position: static;
  border: none;
  font-size: 16px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Thinking block */
.thinking-wrap {
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 8px;
  overflow: hidden;
  font-size: 13px;
  max-width: 100%;
}
.thinking-hdr {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px;
  cursor: pointer;
  color: #9B9B9B;
  font-size: 12px;
  user-select: none;
}
.thinking-hdr .arr { transition: transform 0.2s; font-size: 10px; }
.thinking-wrap.open .arr { transform: rotate(90deg); }
.thinking-body {
  display: none;
  padding: 8px 10px;
  color: #555;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
  border-top: 1px solid rgba(0,0,0,0.08);
}
.thinking-wrap.open .thinking-body { display: block; }

/* Time + retry */
.msg-time { font-size: 11px; color: #9B9B9B; padding: 0 2px; }
.msg.user .msg-time { text-align: right; }
.retry-notice {
  align-self: center;
  font-size: 12px; color: #9B9B9B;
  background: rgba(0,0,0,0.06);
  border-radius: 4px;
  padding: 3px 10px; margin: 4px 0;
}

/* ── INPUT BAR ── */
footer {
  background: #F7F7F7;
  border-top: 1px solid #D0D0D0;
  padding: 8px 12px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  flex-shrink: 0;
  position: relative;
}
.input-row { display: flex; align-items: flex-end; gap: 8px; }

/* Sticker panel */
#sticker-panel {
  display: none;
  padding: 10px 4px 4px;
  border-top: 1px solid #D0D0D0;
  margin-bottom: 8px;
}
#sticker-panel.open { display: block; }
.sticker-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
}
.sticker-item {
  font-size: 34px;
  text-align: center;
  padding: 6px 2px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.sticker-item:active { background: rgba(0,0,0,0.08); }

/* Footer icon buttons */
.footer-icon-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: #E8E8E8;
  color: #555;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
  transition: background 0.15s;
}
.footer-icon-btn:active { background: #D0D0D0; }

/* Sticker bubble — transparent, big emoji */
.bubble.sticker {
  background: transparent !important;
  border: none !important;
  font-size: 56px;
  line-height: 1;
  padding: 4px 0 !important;
}
.bubble.sticker::before, .bubble.sticker::after { display: none !important; }

/* Image bubble */
.bubble img.chat-img {
  max-width: 200px;
  max-height: 200px;
  border-radius: 8px;
  display: block;
}
#input {
  flex: 1;
  background: #FFF;
  border: 1px solid #D0D0D0;
  border-radius: 20px;
  padding: 9px 16px;
  font-family: inherit;
  font-size: 16px;
  color: #181818;
  resize: none;
  max-height: 120px;
  min-height: 38px;
  line-height: 1.4;
  field-sizing: content;
  outline: none;
}
#input::placeholder { color: #BBBBB5; }
#send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: #07C160;
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
#send-btn:disabled { background: #C8C8C8; cursor: default; }
#send-btn:not(:disabled):active { transform: scale(0.88); }

/* ── CALL SCREEN ── */
#call-screen {
  position: fixed; inset: 0;
  background: linear-gradient(180deg,#0D0D1A,#1A1A2E);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 150;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  gap: 12px;
}
#call-screen.active { opacity: 1; pointer-events: auto; }
.call-avatar-lg {
  width: 96px; height: 96px;
  border-radius: 50%;
  background: #1A1A1A;
  border: 3px solid rgba(255,255,255,0.15);
  margin-bottom: 8px;
}
.call-name { font-size: 26px; font-weight: 600; color: #fff; }
.call-status { font-size: 14px; color: rgba(255,255,255,0.55); }
.call-timer { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 40px; font-variant-numeric: tabular-nums; }
.call-controls { display: flex; gap: 48px; align-items: center; }
.call-mic-btn {
  width: 68px; height: 68px; border-radius: 50%;
  border: none; background: #2ECC71; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.call-mic-btn.listening { background: #E74C3C; animation: cpulse 1.2s ease infinite; }
.call-mic-btn.disabled { background: #555; cursor: default; }
@keyframes cpulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
  60% { box-shadow: 0 0 0 18px rgba(231,76,60,0); }
}
.call-end-btn {
  width: 68px; height: 68px; border-radius: 50%;
  border: none; background: #E74C3C; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.call-vol-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: none; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

/* ── AUTH SCREEN ── */
#auth-screen {
  position: fixed; inset: 0;
  background: #EDEDED;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 32px; z-index: 100;
}
#auth-screen.hidden { display: none; }
.auth-logo {
  width: 80px; height: 80px;
  border-radius: 20px;
  background: linear-gradient(135deg,#6B3FA0,#4B6CB7);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; color: #fff; font-weight: 600;
}
.auth-title { font-size: 20px; font-weight: 600; }
.auth-input {
  width: 100%; max-width: 300px;
  padding: 12px 16px;
  border: 1px solid #D0D0D0;
  border-radius: 8px;
  background: #FFF;
  font-family: inherit; font-size: 16px;
  color: #181818; outline: none;
}
.auth-btn {
  width: 100%; max-width: 300px;
  padding: 13px;
  background: #07C160;
  color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 16px;
  cursor: pointer; font-weight: 500;
}
.auth-hint { font-size: 12px; color: #9B9B9B; text-align: center; }

/* ── SETTINGS PANEL ── */
#settings {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex; align-items: flex-end;
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
#settings.open { opacity:1; pointer-events:auto; }
.settings-sheet {
  width: 100%; max-width: 640px; margin: 0 auto;
  background: #F7F7F7;
  border-radius: 16px 16px 0 0;
  padding: 20px 20px max(20px,env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.25s ease;
  display: flex; flex-direction: column; gap: 12px;
}
#settings.open .settings-sheet { transform: none; }
.settings-title {
  font-size: 16px; font-weight: 600;
  text-align: center; padding-bottom: 4px;
}
.settings-divider { height: 1px; background: #D0D0D0; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px;
}
.settings-row input[type=text] {
  background: #FFF;
  border: 1px solid #D0D0D0;
  border-radius: 8px;
  padding: 6px 10px;
  font-family: inherit; font-size: 14px;
  color: #181818; outline: none;
}
.danger-btn {
  width: 100%; padding: 13px;
  background: #FA5151; color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 15px;
  cursor: pointer; font-weight: 500;
}
.settings-cancel {
  width: 100%; padding: 13px;
  background: #FFF; color: #181818;
  border: 1px solid #D0D0D0; border-radius: 8px;
  font-family: inherit; font-size: 15px; cursor: pointer;
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-logo">阴</div>
  <div class="auth-title">Ombre · 阴影</div>
  <input class="auth-input" id="auth-input" type="password" placeholder="访问密钥" autocomplete="current-password">
  <button class="auth-btn" id="auth-btn">进入</button>
  <div class="auth-hint">在服务器 CHAT_SECRET 环境变量中设置密钥<br>留空则不需要密钥</div>
</div>

<!-- HEADER -->
<header>
  <button class="hdr-btn" id="settings-btn" title="设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="hdr-center">
    <div class="contact-name">阴影</div>
    <div class="contact-status" id="status-label">待机</div>
  </div>
  <button class="hdr-btn" id="call-btn" title="语音通话">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.78a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
  </button>
  <div id="status-dot"></div>
</header>

<!-- CALL SCREEN -->
<div id="call-screen">
  <div class="call-avatar-lg"></div>
  <div class="call-name">阴影</div>
  <div class="call-status" id="call-status-txt">正在连接…</div>
  <div class="call-timer" id="call-timer">00:00</div>
  <div class="call-controls">
    <button class="call-vol-btn" id="call-vol" title="静音扬声器">🔊</button>
    <button class="call-mic-btn" id="call-mic">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0M12 19v3M9 22h6"/>
      </svg>
    </button>
    <button class="call-end-btn" id="call-end">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
      </svg>
    </button>
  </div>
</div>

<!-- MESSAGES -->
<div id="messages"></div>

<!-- INPUT -->
<footer>
  <div id="sticker-panel">
    <div class="sticker-grid" id="sticker-grid"></div>
  </div>
  <div class="input-row">
    <button class="footer-icon-btn" id="photo-btn" title="发图片">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button class="footer-icon-btn" id="sticker-btn" title="贴纸">🐱</button>
    <textarea id="input" placeholder="发消息…" rows="1"></textarea>
    <button id="send-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <input type="file" id="photo-input" accept="image/*" style="display:none">
</footer>

<!-- SETTINGS PANEL -->
<div id="settings">
  <div class="settings-sheet">
    <div class="settings-title">设置</div>
    <div class="settings-divider"></div>
    <div class="settings-row">
      <span>服务地址</span>
      <input type="text" id="cfg-host" placeholder="https://your-server.com" style="width:180px">
    </div>
    <div class="settings-row">
      <span>访问密钥</span>
      <input type="text" id="cfg-secret" placeholder="留空则无需密钥" style="width:180px">
    </div>
    <div class="settings-divider"></div>
    <button class="auth-btn" id="cfg-save">保存</button>
    <button class="auth-btn" id="push-btn" style="background:#4B6CB7">开启通知推送</button>
    <button class="danger-btn" id="new-session-btn">🔄 新会话（清除上下文）</button>
    <button class="danger-btn" id="clear-history-btn" style="background:#9B9B9B">🗑 清除本地聊天记录</button>
    <button class="settings-cancel" id="settings-close">取消</button>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const cfg = {
  host:   localStorage.getItem('ombre_host')   || location.origin,
  secret: localStorage.getItem('ombre_secret') || '',
};
let chatId = localStorage.getItem('ombre_chatid') || uuid();
localStorage.setItem('ombre_chatid', chatId);

// ── AUTH ──────────────────────────────────────────────────────────────────────
const authScreen = document.getElementById('auth-screen');
if (cfg.secret) authScreen.classList.add('hidden');
document.getElementById('auth-btn').onclick = () => {
  cfg.secret = document.getElementById('auth-input').value.trim();
  localStorage.setItem('ombre_secret', cfg.secret);
  authScreen.classList.add('hidden');
};
document.getElementById('auth-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

// ── STATE ─────────────────────────────────────────────────────────────────────
let isGenerating = false;
let history = JSON.parse(localStorage.getItem(`ombre_hist_${chatId}`) || '[]');

// ── SETTINGS PANEL ────────────────────────────────────────────────────────────
const settingsEl = document.getElementById('settings');
document.getElementById('settings-btn').onclick = () => {
  document.getElementById('cfg-host').value   = cfg.host;
  document.getElementById('cfg-secret').value = cfg.secret;
  settingsEl.classList.add('open');
};
const closeSettings = () => settingsEl.classList.remove('open');
settingsEl.addEventListener('click', e => { if (e.target === settingsEl) closeSettings(); });
document.getElementById('settings-close').onclick = closeSettings;
document.getElementById('cfg-save').onclick = () => {
  cfg.host   = document.getElementById('cfg-host').value.trim()   || location.origin;
  cfg.secret = document.getElementById('cfg-secret').value.trim();
  localStorage.setItem('ombre_host',   cfg.host);
  localStorage.setItem('ombre_secret', cfg.secret);
  closeSettings();
};
document.getElementById('new-session-btn').onclick = () => {
  if (!confirm('开始新会话，Claude 将失去本次对话记忆（Ombre Brain 长期记忆保留）')) return;
  fetch(`${cfg.host}/api/session/${chatId}`, {
    method: 'DELETE',
    headers: cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {},
  }).catch(() => {});
  chatId = uuid();
  localStorage.setItem('ombre_chatid', chatId);
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  closeSettings();
  setStatus('idle');
};
document.getElementById('clear-history-btn').onclick = () => {
  if (!confirm('清除本地聊天记录显示？（不影响 Claude 进程内记忆）')) return;
  history = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  closeSettings();
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function saveHistory() {
  localStorage.setItem(`ombre_hist_${chatId}`, JSON.stringify(history.slice(-200)));
}
function setStatus(s) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  dot.className = 'status-dot ' + (s === 'idle' ? '' : s);
  label.textContent = { idle:'待机', active:'连接中…', thinking:'思考中…', error:'出错了' }[s] || s;
}
function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── CREATE MESSAGE ROW ────────────────────────────────────────────────────────
function createMsgRow(role) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

  let contentEl = wrap;

  if (role !== 'user') {
    const avatar = document.createElement('div');
    avatar.className = 'ai-avatar';
    wrap.appendChild(avatar);

    const content = document.createElement('div');
    content.className = 'msg-content';
    wrap.appendChild(content);
    contentEl = content;
  } else {
    const content = document.createElement('div');
    content.className = 'msg-content';
    wrap.appendChild(content);
    contentEl = content;
  }

  msgs.appendChild(wrap);
  return { wrap, contentEl };
}

function appendMsg(role, text, thinking, time) {
  const msgs = document.getElementById('messages');
  const { wrap, contentEl } = createMsgRow(role);

  if (thinking) {
    const tw = document.createElement('div');
    tw.className = 'thinking-wrap';
    tw.innerHTML = `<div class="thinking-hdr"><span class="arr">▶</span> 思考过程</div>
      <div class="thinking-body">${escHtml(thinking)}</div>`;
    tw.querySelector('.thinking-hdr').onclick = () => tw.classList.toggle('open');
    contentEl.appendChild(tw);
  }

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  contentEl.appendChild(bub);

  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = time || now();
  contentEl.appendChild(t);

  msgs.scrollTop = msgs.scrollHeight;
  return bub;
}

// ── RENDER HISTORY ────────────────────────────────────────────────────────────
history.forEach(m => appendMsg(m.role, m.text, m.thinking, m.time));

// ── SEND ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || isGenerating) return;
  input.value = '';
  input.style.height = '';
  const userTime = now();
  appendMsg('user', text, null, userTime);
  history.push({ role:'user', text, time: userTime });
  saveHistory();
  streamAI(text);
}

// ── INPUT EVENTS ──────────────────────────────────────────────────────────────
document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── STICKER PANEL ─────────────────────────────────────────────────────────────
const STICKERS = ['😺','😸','😹','😻','😼','😽','🙀','😿','😾','🐱','🐈','🐾',
                  '💕','🎀','✨','🥺','💤','🌙','☀️','🍵','🐟','🧸','💭','🤍'];
const stickerGrid = document.getElementById('sticker-grid');
STICKERS.forEach(s => {
  const el = document.createElement('div');
  el.className = 'sticker-item';
  el.textContent = s;
  el.onclick = () => {
    sendSticker(s);
    document.getElementById('sticker-panel').classList.remove('open');
  };
  stickerGrid.appendChild(el);
});

document.getElementById('sticker-btn').onclick = () => {
  document.getElementById('sticker-panel').classList.toggle('open');
};

function sendSticker(emoji) {
  if (isGenerating) return;
  const msgs = document.getElementById('messages');

  // Show sticker bubble
  const { contentEl } = createMsgRow('user');
  const bub = document.createElement('div');
  bub.className = 'bubble sticker';
  bub.textContent = emoji;
  contentEl.appendChild(bub);
  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = now();
  contentEl.appendChild(t);
  msgs.scrollTop = msgs.scrollHeight;

  const userTime = now();
  history.push({ role:'user', text: emoji, time: userTime });
  saveHistory();

  // Send to AI and stream response
  streamAI(emoji);
}

// ── PHOTO BUTTON ──────────────────────────────────────────────────────────────
document.getElementById('photo-btn').onclick = () => {
  document.getElementById('photo-input').click();
};

document.getElementById('photo-input').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  const reader = new FileReader();
  reader.onload = async (ev) => {
    const dataUrl = ev.target.result;
    const base64 = dataUrl.split(',')[1];
    const mediaType = file.type || 'image/jpeg';
    const msgs = document.getElementById('messages');

    // Show image bubble
    const { contentEl } = createMsgRow('user');
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.style.padding = '6px';
    const img = document.createElement('img');
    img.src = dataUrl;
    img.className = 'chat-img';
    bub.appendChild(img);
    contentEl.appendChild(bub);
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.textContent = now();
    contentEl.appendChild(t);
    msgs.scrollTop = msgs.scrollHeight;

    history.push({ role:'user', text:'[图片]', time: now() });
    saveHistory();

    // Send multimodal content to AI
    const content = [
      { type:'image', source:{ type:'base64', media_type: mediaType, data: base64 } },
      { type:'text', text:'(用户发来一张图片)' }
    ];
    streamAI(null, content);
  };
  reader.readAsDataURL(file);
};

// ── STREAM AI (shared) ────────────────────────────────────────────────────────
async function streamAI(text, content, onComplete) {
  if (isGenerating) return;
  isGenerating = true;
  document.getElementById('send-btn').disabled = true;
  setStatus('active');

  const msgs = document.getElementById('messages');
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg ai';
  const aiAvatar = document.createElement('div');
  aiAvatar.className = 'ai-avatar';
  aiWrap.appendChild(aiAvatar);
  const aiContent = document.createElement('div');
  aiContent.className = 'msg-content';
  aiWrap.appendChild(aiContent);
  const aiBub = document.createElement('div');
  aiBub.className = 'bubble streaming';
  aiContent.appendChild(aiBub);
  msgs.appendChild(aiWrap);
  msgs.scrollTop = msgs.scrollHeight;

  let fullText = '';
  let thinkingTxt = '';
  let thinkingWrap = null;
  let thinkingBody = null;

  try {
    const body = content
      ? JSON.stringify({ chatId, content })
      : JSON.stringify({ chatId, text });
    const res = await fetch(`${cfg.host}/api/chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        handleStreamEvent(ev);
      }
    }
  } catch (err) {
    aiBub.textContent = `⚠ 连接失败：${err.message}`;
    aiBub.classList.remove('streaming');
    setStatus('error');
    isGenerating = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  function handleStreamEvent(ev) {
    if (ev.type === 'stream_event') {
      const delta = ev.event?.delta;
      if (!delta) return;
      if (delta.type === 'thinking_delta' && delta.thinking) {
        setStatus('thinking');
        thinkingTxt += delta.thinking;
        if (!thinkingWrap) {
          thinkingWrap = document.createElement('div');
          thinkingWrap.className = 'thinking-wrap open';
          thinkingBody = document.createElement('div');
          thinkingBody.className = 'thinking-body';
          const hdr = document.createElement('div');
          hdr.className = 'thinking-hdr';
          hdr.innerHTML = '<span class="arr">▶</span> 思考中…';
          hdr.onclick = () => thinkingWrap.classList.toggle('open');
          thinkingWrap.appendChild(hdr);
          thinkingWrap.appendChild(thinkingBody);
          aiContent.insertBefore(thinkingWrap, aiBub);
        }
        thinkingBody.textContent = thinkingTxt;
        msgs.scrollTop = msgs.scrollHeight;
      }
      if (delta.type === 'text_delta' && delta.text) {
        setStatus('active');
        fullText += delta.text;
        aiBub.textContent = fullText;
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
    if (ev.type === 'system/api_retry') {
      const notice = document.createElement('div');
      notice.className = 'retry-notice';
      notice.textContent = `⏳ 限流中，${(ev.retry_delay_ms/1000).toFixed(0)}s 后重试…`;
      msgs.insertBefore(notice, aiWrap);
      setTimeout(() => notice.remove(), (ev.retry_delay_ms||5000)+500);
    }
    if (ev.type === 'result') {
      aiBub.classList.remove('streaming');
      // detect sticker response
      const trimmed = fullText.trim();
      if ([...trimmed].length <= 3 && /\p{Emoji}/u.test(trimmed)) {
        aiBub.classList.add('sticker');
      }
      const aiTime = now();
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = aiTime;
      aiContent.appendChild(timeEl);
      history.push({ role:'ai', text: fullText, thinking: thinkingTxt||null, time: aiTime });
      saveHistory();
      setStatus('idle');
      isGenerating = false;
      document.getElementById('send-btn').disabled = false;
      if (onComplete) onComplete(fullText);
    }
  }
}

// ── VOICE CALL ────────────────────────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let callActive = false;
let callTimerInterval = null;
let callSeconds = 0;
let speakerOn = true;
let callListening = false;
let zhVoice = null;

// 预加载中文声音
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.startsWith('zh')) || voices[0] || null;
}
if (window.speechSynthesis) {
  speechSynthesis.addEventListener('voiceschanged', loadVoices);
  loadVoices();
}

// TTS
function speak(text) {
  if (!speakerOn || !window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-CN';
  utt.rate = 1.05;
  if (zhVoice) utt.voice = zhVoice;
  utt.onend = () => { if (callActive && !isGenerating) startCallListening(); };
  utt.onerror = () => { if (callActive && !isGenerating) startCallListening(); };
  speechSynthesis.speak(utt);
}

function startCallListening() {
  if (!recognition || callListening || isGenerating) return;
  try {
    recognition.start();
  } catch(e) {}
}

function updateCallTimer() {
  callSeconds++;
  const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
  const s = String(callSeconds%60).padStart(2,'0');
  document.getElementById('call-timer').textContent = `${m}:${s}`;
}

function openCall() {
  callActive = true;
  callSeconds = 0;
  document.getElementById('call-screen').classList.add('active');
  document.getElementById('call-status-txt').textContent = '通话中';
  callTimerInterval = setInterval(updateCallTimer, 1000);

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      callListening = true;
      document.getElementById('call-mic').classList.add('listening');
      document.getElementById('call-status-txt').textContent = '正在听…';
    };
    recognition.onend = () => {
      callListening = false;
      document.getElementById('call-mic').classList.remove('listening');
      if (callActive && !isGenerating && !speechSynthesis.speaking) {
        document.getElementById('call-status-txt').textContent = '通话中';
      }
    };
    recognition.onresult = async (e) => {
      const transcript = e.results[0][0].transcript.trim();
      if (!transcript) return;
      document.getElementById('call-status-txt').textContent = '思考中…';

      // Show in chat too
      const userTime = now();
      appendMsg('user', transcript, null, userTime);
      history.push({ role:'user', text: transcript, time: userTime });
      saveHistory();

      // Stream AI and speak response
      await streamAI(transcript, null, (fullText) => {
        speak(fullText);
      });
    };
    recognition.onerror = () => {
      callListening = false;
      document.getElementById('call-mic').classList.remove('listening');
    };

    // Auto-start listening
    setTimeout(() => startCallListening(), 500);
  } else {
    document.getElementById('call-status-txt').textContent = '浏览器不支持语音识别';
  }
}

function closeCall() {
  callActive = false;
  clearInterval(callTimerInterval);
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('call-screen').classList.remove('active');
  document.getElementById('call-timer').textContent = '00:00';
}

document.getElementById('call-btn').onclick = () => {
  // iOS 必须在用户手势里先触发一次 TTS 才能解锁后续异步调用
  if (window.speechSynthesis) {
    const warmup = new SpeechSynthesisUtterance(' ');
    warmup.volume = 0;
    speechSynthesis.speak(warmup);
  }
  openCall();
};
document.getElementById('call-end').onclick = closeCall;
document.getElementById('call-mic').onclick = () => {
  if (callListening) { try { recognition.stop(); } catch(e) {} }
  else startCallListening();
};
document.getElementById('call-vol').onclick = () => {
  speakerOn = !speakerOn;
  document.getElementById('call-vol').textContent = speakerOn ? '🔊' : '🔇';
  if (!speakerOn) speechSynthesis.cancel();
};

// ── SERVICE WORKER + PUSH ─────────────────────────────────────────────────────
function urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function subscribePush(reg) {
  if (!('PushManager' in window)) return;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const { key } = await fetch(`${cfg.host}/api/push/key`).then(r => r.json());
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(key),
    });
    await fetch(`${cfg.host}/api/push/subscribe`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(cfg.secret ? { Authorization: `Bearer ${cfg.secret}` } : {}),
      },
      body: JSON.stringify({ chatId, subscription: sub }),
    });
    console.log('[push] subscribed');
  } catch (e) {
    console.warn('[push] failed:', e);
  }
}

let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => { swReg = reg; })
    .catch(() => {});
}

document.getElementById('push-btn').onclick = async () => {
  if (!swReg) return alert('Service Worker 未就绪，请刷新页面');
  await subscribePush(swReg);
  alert('通知已开启！');
};
</script>
